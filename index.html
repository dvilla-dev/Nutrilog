    </div>
    <div id="cp-results">
      ${renderResults('')}
    </div>
  `;
  openSheet(html);

  const bindPicks = () => {
    document.querySelectorAll('[data-pick-my]').forEach(el => {
      el.onclick = () => {
        const f = state.customFoods.find(x => x.id === el.dataset.pickMy);
        // Imposta returnTo per tornare qui dopo l'aggiunta
        state.addFood = { returnTo: { type: 'customPicker', meal } };
        openAddFood({...f, _custom: true}, meal);
      };
    });
  };
  bindPicks();

  const searchInp = document.getElementById('cp-search');
  const resultsBox = document.getElementById('cp-results');
  if (searchInp && resultsBox) {
    searchInp.addEventListener('input', () => {
      resultsBox.innerHTML = renderResults(searchInp.value);
      bindPicks();
    });
  }
}

/* ═══════════════════════════════════════════════════════════
   BINDINGS
   ═══════════════════════════════════════════════════════════ */
function bindApp() {
  // Header back button (presente su tab Cerca arrivati da un pasto)
  const headerBack = document.getElementById('header-back');
  if (headerBack) {
    headerBack.onclick = () => {
      const origin = state.searchOriginTab || 'today';
      state.searchOriginTab = null;
      state.searchQuery = '';
      state.searchResults = [];
      state.searchTemplateResults = [];
      state.searchState = 'idle';
      state.aiSearchPending = null;
      state.tab = origin;
      render();
    };
  }
  // Tab bar manuale annulla la "origine" del search (se l'utente cambia
  // tab manualmente la prossima volta non c'è back automatico).
  if (state.tab !== 'search') {
    state.searchOriginTab = null;
  }

  // Edge swipe (bordo sinistro → destra) sullo screen quando c'è un back
  // disponibile, per tornare alla tab di origine come gesture iOS nativa.
  if (state.searchOriginTab && state.tab === 'search') {
    const screen = document.getElementById('screen');
    if (screen) {
      let sx = 0, sy = 0, cx = 0, cy = 0, dragging = false;
      screen.addEventListener('touchstart', (e) => {
        if (e.touches.length !== 1) return;
        const t = e.touches[0];
        if (t.clientX > 30) return; // solo dal bordo sinistro
        sx = t.clientX; sy = t.clientY;
        cx = sx; cy = sy;
        dragging = true;
      }, { passive: true });
      screen.addEventListener('touchmove', (e) => {
        if (!dragging) return;
        cx = e.touches[0].clientX;
        cy = e.touches[0].clientY;
        const dx = cx - sx;
        const dy = Math.abs(cy - sy);
        if (dy > Math.abs(dx) + 10) { dragging = false; screen.style.transform = ''; return; }
        if (dx > 0) screen.style.transform = `translateX(${dx}px)`;
      }, { passive: true });
      screen.addEventListener('touchend', () => {
        if (!dragging) return;
        dragging = false;
        const dx = cx - sx;
        if (dx > 80) {
          screen.style.transition = 'transform 200ms ease-out';
          screen.style.transform = 'translateX(100%)';
          setTimeout(() => {
            const origin = state.searchOriginTab || 'today';
            state.searchOriginTab = null;
            state.searchQuery = '';
            state.searchResults = [];
            state.searchTemplateResults = [];
            state.searchState = 'idle';
            state.aiSearchPending = null;
            state.tab = origin;
            render();
          }, 200);
        } else {
          screen.style.transition = 'transform 180ms ease';
          screen.style.transform = '';
        }
      });
    }
  }

  // tabbar
  document.querySelectorAll('.tab').forEach(t => {
    t.onclick = async () => {
      const next = t.dataset.tab;
      // Cambio tab esplicito tramite tab bar: scarta scroll memorizzato dello sheet
      _savedScrollBeforeSheet = null;
      // NON azzeriamo _tabScroll[next]: vogliamo ripristinare la posizione
      // dell'ultima visita in quella tab (es. se ero su "Cena" in today,
      // andavo in Cerca, torno → resto su "Cena").
      // Se l'utente tappa "Oggi" mentre è già sulla tab today ma su un giorno diverso,
      // riporta al giorno corrente (utility quando si è navigato avanti/indietro).
      if (next === 'today' && state.tab === 'today' && state.date !== todayISO()) {
        state.date = todayISO();
        _tabScroll['today'] = 0; // qui sì azzeriamo, è un cambio di giorno
        await loadDiary(state.date);
        render();
        return;
      }
      // Se l'utente tappa la stessa tab in cui è già, riporta in cima (comportamento iOS native)
      if (next === state.tab) {
        const screen = document.getElementById('screen');
        if (screen) screen.scrollTo({ top: 0, behavior: 'smooth' });
        _tabScroll[next] = 0;
        return;
      }
      // Se l'utente entra dalla tab bar senza pasto specificato:
      // - search: default colazione (può cambiarlo dal foglio quantità)
      // - photo: pasto suggerito dall'orario corrente
      if (next === 'search' && state.tab !== next) {
        state.targetMeal = 'breakfast';
        // Reset search ogni volta che si entra nella tab (non ricordare ricerche precedenti)
        state.searchQuery = '';
        state.searchResults = [];
        state.searchTemplateResults = [];
        state.searchState = 'idle';
        // Carica gli alimenti più usati in background (non blocca il render)
        getMostUsedFoods(8).then(list => {
          state.mostUsedFoods = list;
          if (state.tab === 'search' && !state.searchQuery) render();
        }).catch(e => dlog('mostUsed FAIL: ' + e.message));
      }
      // Se si esce DA search, resetta lo stato della ricerca
      if (state.tab === 'search' && next !== 'search') {
        state.searchQuery = '';
        state.searchResults = [];
        state.searchTemplateResults = [];
        state.searchState = 'idle';
        state.aiSearchPending = null;
      }
      if (next === 'photo' && state.tab !== next) {
        state.targetMeal = suggestMealByTime();
      }
      state.tab = next;
      render();
    };
  });

  // photo tab actions
  const phMealPick = document.getElementById('ph-meal-pick');
  if (phMealPick) {
    phMealPick.querySelectorAll('[data-meal-pick]').forEach(b => {
      b.onclick = () => {
        state.targetMeal = b.dataset.mealPick;
        phMealPick.querySelectorAll('button').forEach(x => x.classList.toggle('sel', x.dataset.mealPick === state.targetMeal));
      };
    });
  }
  const phCam = document.getElementById('ph-camera');
  const phGal = document.getElementById('ph-gallery');
  const phInputCam = document.getElementById('ph-input-cam');
  const phInputGal = document.getElementById('ph-input-gal');
  const phSetup = document.getElementById('ph-setup');
  if (phCam) phCam.onclick = () => phInputCam.click();
  if (phGal) phGal.onclick = () => phInputGal.click();
  if (phSetup) phSetup.onclick = () => openAiSetupSheet();
  const onPhotoPick = (input) => {
    if (!input) return;
    input.onchange = async () => {
      const f = input.files && input.files[0];
      if (!f) return;
      await analyzeFoodPhoto(f, state.targetMeal || suggestMealByTime());
    };
  };
  onPhotoPick(phInputCam);
  onPhotoPick(phInputGal);

  // date nav
  document.querySelectorAll('[data-date]').forEach(b => {
    b.onclick = async () => {
      const direction = b.dataset.date === 'next' ? 1 : -1;
      const newDate = shiftDate(state.date, direction);
      const todayMs = new Date(todayISO()).getTime();
      const newMs = new Date(newDate).getTime();
      // Limiti: 14 giorni indietro (retention) e 14 giorni avanti (planning)
      if (direction === -1) {
        const cutoffMs = todayMs - (DIARY_RETENTION_DAYS * 24 * 60 * 60 * 1000);
        if (newMs < cutoffMs) {
          toast(`I dati oltre ${DIARY_RETENTION_DAYS} giorni vengono cancellati automaticamente`);
          return;
        }
      } else {
        const futureMs = todayMs + (DIARY_RETENTION_DAYS * 24 * 60 * 60 * 1000);
        if (newMs > futureMs) {
          toast(`Pianificazione disponibile fino a ${DIARY_RETENTION_DAYS} giorni in avanti`);
          return;
        }
      }
      state.date = newDate;
      state.selectionMode = null; // reset selezione al cambio data
      await loadDiary(state.date);
      render();
    };
  });

  // open calendar on date label tap
  const calBtn = document.querySelector('[data-open-calendar]');
  if (calBtn) calBtn.onclick = () => openCalendarSheet();

  // open dashboard config sheet
  const dashCfgBtn = document.querySelector('[data-open-dash-cfg]');
  if (dashCfgBtn) dashCfgBtn.onclick = () => openDashCfgSheet();

  // Resize maniglie sulle card della dashboard
  // Altezze "naturali" di riferimento per calcolare lo zoom proporzionale dei contenuti
  const CARD_BASE_HEIGHT = { kcal: 340, macro: 180, micro: 130, week: 180 };
  document.querySelectorAll('[data-resize-card]').forEach(handle => {
    const card = handle.parentElement;
    if (!card) return;
    const cardId = handle.dataset.resizeCard;
    const baseH = CARD_BASE_HEIGHT[cardId] || 200;
    let startY = 0;
    let startH = 0;
    let dragging = false;

    // Applica una scala proporzionale ai contenuti della card
    const applyScale = (height) => {
      const scale = Math.max(0.3, Math.min(2.5, height / baseH));
      card.style.setProperty('--card-scale', scale);
    };
    // Applica scala iniziale (da altezza salvata)
    const initialH = card.getBoundingClientRect().height;
    applyScale(initialH);

    const onDown = (clientY) => {
      startY = clientY;
      startH = card.getBoundingClientRect().height;
      dragging = true;
      handle.classList.add('dragging');
      card.classList.add('resizing');
    };
    const onMove = (clientY) => {
      if (!dragging) return;
      const delta = clientY - startY;
      // Limiti più larghi: 50px (super-compatto) – 800px
      const newH = Math.max(50, Math.min(800, startH + delta));
      card.style.minHeight = newH + 'px';
      card.style.height = newH + 'px';
      applyScale(newH);
    };
    const onUp = () => {
      if (!dragging) return;
      dragging = false;
      handle.classList.remove('dragging');
      card.classList.remove('resizing');
      // Salva la nuova altezza
      const finalH = card.getBoundingClientRect().height;
      const cfg = getDashboardCfg();
      cfg.heights[cardId] = Math.round(finalH);
      setDashboardCfg(cfg);
    };

    // Touch (mobile)
    handle.addEventListener('touchstart', (e) => {
      if (e.touches.length !== 1) return;
      onDown(e.touches[0].clientY);
      e.preventDefault();
    }, { passive: false });
    handle.addEventListener('touchmove', (e) => {
      if (!dragging) return;
      onMove(e.touches[0].clientY);
      e.preventDefault();
    }, { passive: false });
    handle.addEventListener('touchend', onUp);
    handle.addEventListener('touchcancel', onUp);

    // Mouse (desktop)
    handle.addEventListener('mousedown', (e) => {
      onDown(e.clientY);
      const mm = (ev) => onMove(ev.clientY);
      const mu = () => {
        onUp();
        document.removeEventListener('mousemove', mm);
        document.removeEventListener('mouseup', mu);
      };
      document.addEventListener('mousemove', mm);
      document.addEventListener('mouseup', mu);
    });
  });

  // populate week summary on today tab
  if (state.tab === 'today') {
    populateWeekSummaryCard().catch(e => dlog('week summary FAIL: ' + e.message));
  }

  // food delete
  document.querySelectorAll('[data-del]').forEach(b => {
    b.onclick = async (e) => {
      e.stopPropagation();
      const [meal, id] = b.dataset.del.split(':');
      await removeFromDiary(meal, id);
      render();
    };
  });

  // food edit (tap on item)
  document.querySelectorAll('[data-edit]').forEach(row => {
    row.onclick = () => {
      const [meal, id] = row.dataset.edit.split(':');
      openEditEntry(meal, id);
    };
  });

  // copy meal from previous day
  document.querySelectorAll('[data-copy-meal]').forEach(b => {
    b.onclick = (e) => {
      e.stopPropagation();
      openCopyMealSheet(b.dataset.copyMeal);
    };
  });

  // Selection mode: enter
  document.querySelectorAll('[data-sel-start]').forEach(b => {
    b.onclick = (e) => {
      e.stopPropagation();
      const meal = b.dataset.selStart;
      state.selectionMode = { meal, selected: new Set() };
      render();
    };
  });
  // Selection mode: cancel
  document.querySelectorAll('[data-sel-cancel]').forEach(b => {
    b.onclick = (e) => {
      e.stopPropagation();
      state.selectionMode = null;
      render();
    };
  });
  // Selection mode: toggle item
  document.querySelectorAll('[data-sel-toggle]').forEach(row => {
    row.onclick = (e) => {
      e.stopPropagation();
      const [meal, id] = row.dataset.selToggle.split(':');
      if (!state.selectionMode || state.selectionMode.meal !== meal) return;
      if (state.selectionMode.selected.has(id)) {
        state.selectionMode.selected.delete(id);
      } else {
        state.selectionMode.selected.add(id);
      }
      render();
    };
  });
  // Selection mode: bulk delete
  // Selection mode: bulk delete con UNDO
  document.querySelectorAll('[data-sel-delete]').forEach(b => {
    b.onclick = async (e) => {
      e.stopPropagation();
      if (b.disabled) return;
      const meal = b.dataset.selDelete;
      if (!state.selectionMode || state.selectionMode.meal !== meal) return;
      const ids = Array.from(state.selectionMode.selected);
      if (ids.length === 0) return;
      if (!confirm(`Eliminare ${ids.length} aliment${ids.length === 1 ? 'o' : 'i'} dal pasto?`)) return;
      // Salva backup degli items cancellati per l'undo
      const allItems = state.diary[meal] || [];
      const deletedItems = allItems.filter(it => state.selectionMode.selected.has(it.id));
      const deletedDate = state.date;
      const remaining = allItems.filter(it => !state.selectionMode.selected.has(it.id));
      state.diary[meal] = remaining;
      await saveDiary();
      // Resta in modalità selezione (svuota solo i selezionati)
      // Se non ci sono più alimenti nel pasto, esci automaticamente
      if (remaining.length === 0) {
        state.selectionMode = null;
      } else {
        state.selectionMode.selected.clear();
      }
      render();
      // Toast con undo per 5 secondi
      toastWithUndo(
        `${ids.length} aliment${ids.length === 1 ? 'o eliminato' : 'i eliminati'}`,
        async () => {
          if (state.date !== deletedDate) {
            const dayKey = `diary:${state.user.userId}:${deletedDate}`;
            const day = (await sg(dayKey)) || { breakfast: [], lunch: [], dinner: [], snack: [] };
            day[meal] = [...(day[meal] || []), ...deletedItems];
            await ss(dayKey, day);
            scheduleCloudAutoSync();
            toast('Ripristinati');
            return;
          }
          state.diary[meal] = [...(state.diary[meal] || []), ...deletedItems];
          await saveDiary();
          render();
          toast('Ripristinati');
        }
      );
    };
  });

  // FAB quick add
  const fab = document.getElementById('fab-add');
  if (fab) fab.onclick = openFabMenu;

  // add from meal
  document.querySelectorAll('[data-add-search]').forEach(b => {
    b.onclick = () => {
      state.targetMeal = b.dataset.addSearch;
      // Ricorda da dove veniamo per il bottone "Indietro"
      state.searchOriginTab = state.tab;
      // Reset ricerca per non ricordare la query precedente
      state.searchQuery = '';
      state.searchResults = [];
      state.searchTemplateResults = [];
      state.searchState = 'idle';
      state.tab = 'search';
      // Carica i più usati in background
      getMostUsedFoods(8).then(list => {
        state.mostUsedFoods = list;
        if (state.tab === 'search' && !state.searchQuery) render();
      }).catch(e => dlog('mostUsed FAIL: ' + e.message));
      render();
      setTimeout(() => document.getElementById('q')?.focus(), 50);
    };
  });
  document.querySelectorAll('[data-add-quick]').forEach(b => {
    b.onclick = () => openQuickAddSheet(b.dataset.addQuick);
  });
  document.querySelectorAll('[data-add-template]').forEach(b => {
    b.onclick = () => openTemplatesSheet(b.dataset.addTemplate);
  });
  document.querySelectorAll('[data-add-custom]').forEach(b => {
    b.onclick = () => openCustomPicker(b.dataset.addCustom);
  });

  // search input
  const q = document.getElementById('q');
  if (q) {
    q.oninput = (e) => doSearch(e.target.value.trim());
  }
  const targetSelect = document.getElementById('target-meal-select');
  if (targetSelect) {
    targetSelect.onchange = (e) => { state.targetMeal = e.target.value; };
  }
  // AI Search button: ricerca diretta tramite Gemini
  const aiBtn = document.getElementById('ai-search-btn');
  if (aiBtn) {
    aiBtn.onclick = async () => {
      const query = state.searchQuery;
      if (!query || query.length < 2) return;
      // Se già stiamo cercando questa stessa query, non rifare
      if (state.aiSearchPending === query) return;
      state.aiSearchPending = query;
      // Re-render solo se siamo ancora nella tab search (per non interferire con altre tab)
      if (state.tab === 'search') render();
      try {
        const aiResults = await aiSearchFoodSpecific(query);
        // Rilascia il flag pending solo se è ancora la nostra query
        if (state.aiSearchPending === query) state.aiSearchPending = null;
        // Se nel frattempo l'utente ha cambiato la query o tab, ignora i risultati
        if (state.searchQuery !== query || state.tab !== 'search') {
          if (state.tab === 'search') render();
          return;
        }
        if (!aiResults || aiResults.length === 0) {
          toast('AI non ha trovato risultati per "' + query + '"');
          render();
          return;
        }
        // Marca i risultati come AI
        const tagged = aiResults.map(r => ({ ...r, _ai: true }));
        // Rimuovi eventuali risultati AI precedenti (con _ai true) per non accumularli
        const nonAi = state.searchResults.filter(f => !f._ai);
        const seen = new Set(nonAi.map(f => stripAccents((f.name + '|' + (f.brand || '')).toLowerCase())));
        const fresh = tagged.filter(f => !seen.has(stripAccents((f.name + '|' + (f.brand || '')).toLowerCase())));
        state.searchResults = [...fresh, ...nonAi];
        state.searchState = state.searchResults.length ? 'results' : 'empty';
        render();
        toast(`AI: ${fresh.length} nuov${fresh.length === 1 ? 'o risultato' : 'i risultati'}`);
      } catch (e) {
        if (state.aiSearchPending === query) state.aiSearchPending = null;
        if (state.tab === 'search') render();
        toast('Errore AI: ' + (e.message || 'rete'));
      }
    };
  }
  bindSearchResults();

  // profile navigation
  document.querySelectorAll('[data-go]').forEach(el => {
    el.onclick = () => {
      const go = el.dataset.go;
      if (go === 'goals') openGoalsSheet();
      if (go === 'customFoods') openCustomFoodsSheet();
      if (go === 'templates') openTemplatesSheet();
      if (go === 'dbFoods') openDbFoodsSheet();
      if (go === 'debug') openDebugSheet();
      if (go === 'cloud') openCloudSheet();
      if (go === 'export') handleExport();
      if (go === 'import') handleImport();
      if (go === 'snapshots') openSnapshotsSheet();
      if (go === 'migrate') openMigrateSheet();
      if (go === 'ai-setup') openAiSetupSheet();
      if (go === 'version-info') openVersionInfoSheet();
      if (go === 'logout') {
        if (state.user && state.user.authMode === 'github') {
          if (!confirm('Uscire da @' + state.user.githubLogin + '?\n\nIl token GitHub verrà rimosso da questo dispositivo. Per riaccedere lo dovrai incollare di nuovo (i tuoi dati restano nel gist).')) return;
          cloudBackup.clearConfig();
          logout();
        } else {
          if (!confirm('Uscire dall\'account?')) return;
          logout();
        }
      }
    };
  });
}
function bindSearchResults() {
  document.querySelectorAll('[data-pick]').forEach(el => {
    el.onclick = () => {
      const f = state.searchResults.find(x => String(x.id) === el.dataset.pick);
      if (f) {
        state.addFood = { returnTo: { type: 'search' } };
        openAddFood(f, state.targetMeal);
      }
    };
  });
  // Click su un alimento "più usato" (idle search state)
  document.querySelectorAll('[data-pick-mu]').forEach(el => {
    el.onclick = () => {
      const f = (state.mostUsedFoods || []).find(x => String(x.id) === el.dataset.pickMu);
      if (f) {
        state.addFood = { returnTo: { type: 'search' } };
        openAddFood(f, state.targetMeal);
      }
    };
  });
  document.querySelectorAll('[data-pick-tpl]').forEach(el => {
    el.onclick = async () => {
      const t = (state.searchTemplateResults || []).find(x => x.id === el.dataset.pickTpl);
      if (!t) return;
      await applyTemplate(t, state.targetMeal);
      toast(`"${t.name}" aggiunto a ${({breakfast:'Colazione',lunch:'Pranzo',dinner:'Cena',snack:'Spuntino'})[state.targetMeal] || 'pasto'}`);
      // Torna a Oggi per vedere il risultato
      state.tab = 'today';
      render();
    };
  });
  const retry = document.getElementById('search-retry');
  if (retry) retry.onclick = () => {
    if (state.searchQuery) doSearch(state.searchQuery);
  };
}

/* ─── GO! ──────────────────────────────────────────────── */
boot();
</script>
</body>
</html>
