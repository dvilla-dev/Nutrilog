    inp.addEventListener('input', recalcCfKcal);
  });

  document.getElementById('cf-form').onsubmit = async (e) => {
    e.preventDefault();
    recalcCfKcal();
    const fd = new FormData(e.target);
    const isPieceMode = currentMode === 'piece';
    const unitName = (fd.get('unitName') || '').trim();
    if (isPieceMode && !unitName) {
      toast('Inserisci il nome del pezzo (es. "uovo")');
      return;
    }
    const payload = {
      id: food ? food.id : null,
      name: (fd.get('name') || '').trim(),
      brand: (fd.get('brand') || '').trim(),
      kcal: num(fd.get('kcal')),
      protein: num(fd.get('protein')),
      carbs: num(fd.get('carbs')),
      fat: num(fd.get('fat')),
      fiber: num(fd.get('fiber')),
      sugar: num(fd.get('sugar')),
      sodium: num(fd.get('sodium')),
      notes: (fd.get('notes') || '').trim(),
      // Modalità pezzo: i macro sono PER PEZZO, salviamo unitName e impostiamo
      // unitGrams = 100 in modo che internamente "1 pezzo" = 100g virtuali e i calcoli
      // continuino a funzionare con la stessa logica (kcal * factor / 100).
      unitName: isPieceMode ? unitName : '',
      unitGrams: isPieceMode ? 100 : 0,
    };
    if (!payload.name) { toast('Nome obbligatorio'); return; }
    await saveCustomFood(payload);
    await loadCustomFoods();
    toast(food ? 'Alimento aggiornato' : 'Alimento creato');
    openCustomFoodsSheet();
  };
}

/* ─── TEMPLATES SHEET ──────────────────────────────────── */
/* ─── CALENDARIO + RIEPILOGO SETTIMANALE ──────────────────
   Mostra ±DIARY_RETENTION_DAYS giorni con possibilità di
   navigare e vedere il riepilogo settimanale (Lun-Dom).
   ──────────────────────────────────────────────────────── */
function getMondayOfWeek(iso) {
  // ISO "YYYY-MM-DD" → ritorna il lunedì della stessa settimana (ISO week)
  const d = new Date(iso);
  const day = d.getDay(); // 0=Dom, 1=Lun, ...
  const diff = day === 0 ? -6 : 1 - day; // se domenica torna indietro di 6, altrimenti porta a lun
  d.setDate(d.getDate() + diff);
  return d.toISOString().slice(0, 10);
}

async function computeDayTotalsKcal(date) {
  const d = await sg(`diary:${state.user.userId}:${date}`);
  if (!d) return 0;
  let total = 0;
  for (const meal of ['breakfast','lunch','dinner','snack']) {
    for (const item of (d[meal] || [])) {
      total += (item.kcal || 0) * (item.grams || 0) / 100;
    }
  }
  return total;
}

async function computeWeekSummary(anyDateInWeek) {
  // Restituisce: { from, to, days: [{date, kcal, hasData}], totalKcal, daysWithData,
  //               goalSum, deltaTotal, avgDelta }
  const monday = getMondayOfWeek(anyDateInWeek);
  const days = [];
  let totalKcal = 0;
  let daysWithData = 0;
  let goalSum = 0;
  for (let i = 0; i < 7; i++) {
    const date = shiftDate(monday, i);
    const goals = getGoalsForDate(date);
    const kcal = await computeDayTotalsKcal(date);
    const hasData = kcal > 0;
    days.push({ date, kcal, hasData, goalKcal: goals.calories || 0 });
    if (hasData) {
      totalKcal += kcal;
      daysWithData++;
    }
    goalSum += (goals.calories || 0);
  }
  const sunday = shiftDate(monday, 6);
  return {
    from: monday,
    to: sunday,
    days,
    totalKcal,
    daysWithData,
    goalSum,
    deltaTotal: totalKcal - goalSum, // positivo = eccesso, negativo = difetto
  };
}

async function openCalendarSheet() {
  // Finestra navigabile: 14 giorni indietro (retention) + 14 giorni avanti
  const today = todayISO();
  const todayMs = new Date(today).getTime();
  const cutoffMs = todayMs - (DIARY_RETENTION_DAYS * 24 * 60 * 60 * 1000);
  const futureMs = todayMs + (DIARY_RETENTION_DAYS * 24 * 60 * 60 * 1000);

  // Mostriamo 6 settimane: 3 indietro + corrente + 2 avanti
  const currentMonday = getMondayOfWeek(today);
  const weeks = [];
  for (let w = -3; w <= 2; w++) {
    const monday = shiftDate(currentMonday, 7 * w);
    weeks.push(monday);
  }

  // Calcola totali per ogni giorno (per badge dei kcal e dot indicator)
  const dailyTotals = {};
  for (const monday of weeks) {
    for (let i = 0; i < 7; i++) {
      const date = shiftDate(monday, i);
      dailyTotals[date] = await computeDayTotalsKcal(date);
    }
  }

  // Riepilogo della settimana SELEZIONATA (quella di state.date)
  const summary = await computeWeekSummary(state.date);

  const monthLabels = ['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];
  const dayHead = ['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];

  function dateMs(iso) { return new Date(iso).getTime(); }
  function isInRetention(iso) {
    const ms = dateMs(iso);
    return ms >= cutoffMs && ms <= futureMs;
  }
  function fmtMonth(iso) {
    const m = parseInt(iso.slice(5,7), 10) - 1;
    return monthLabels[m] || '';
  }
  function fmtDay(iso) {
    return parseInt(iso.slice(8,10), 10);
  }

  let weeksHtml = '';
  for (const monday of weeks) {
    const days = [];
    for (let i = 0; i < 7; i++) {
      const date = shiftDate(monday, i);
      const isToday = date === today;
      const isSelected = date === state.date;
      const inRange = isInRetention(date);
      const kcal = dailyTotals[date] || 0;
      const cls = ['cal-cell'];
      if (isToday) cls.push('cal-today');
      if (isSelected) cls.push('cal-selected');
      if (!inRange) cls.push('cal-disabled');
      days.push(`
        <button class="${cls.join(' ')}" ${inRange ? `data-cal-pick="${date}"` : 'disabled'}>
          <div>${fmtDay(date)}</div>
          <div class="cal-month">${fmtMonth(date)}</div>
          ${kcal > 0 ? '<div class="cal-dot"></div>' : ''}
        </button>
      `);
    }
    weeksHtml += `<div class="cal-grid">${days.join('')}</div>`;
  }

  // Riepilogo settimana
  const sumPDate = (() => {
    const fromD = parseInt(summary.from.slice(8,10), 10);
    const toD = parseInt(summary.to.slice(8,10), 10);
    const fromM = monthLabels[parseInt(summary.from.slice(5,7), 10) - 1];
    const toM = monthLabels[parseInt(summary.to.slice(5,7), 10) - 1];
    return fromM === toM ? `${fromD}–${toD} ${toM}` : `${fromD} ${fromM} – ${toD} ${toM}`;
  })();
  const goalAvgPerDay = summary.daysWithData > 0
    ? summary.days.filter(d => d.hasData).reduce((acc, d) => acc + d.goalKcal, 0) / summary.daysWithData
    : 0;
  const consumedAvgPerDay = summary.daysWithData > 0 ? summary.totalKcal / summary.daysWithData : 0;
  const avgDelta = consumedAvgPerDay - goalAvgPerDay;
  const deltaSign = summary.deltaTotal > 0 ? '+' : '';
  const deltaColor = Math.abs(summary.deltaTotal) < 100 ? 'var(--text-2)' : (summary.deltaTotal > 0 ? 'var(--warning, #fb0)' : '#5cf');
  const deltaLabel = summary.deltaTotal > 0 ? 'in eccesso' : (summary.deltaTotal < 0 ? 'in difetto' : 'in linea');
  const noGoal = summary.goalSum === 0;

  const summaryHtml = `
    <div class="cal-week-summary">
      <div style="font-size:11px;color:var(--text-3);font-weight:600;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:6px">Riepilogo settimana ${esc(sumPDate)}</div>

          <div style="font-size:13px;color:var(--text-2)">Calorie totali</div>
          <div style="font-size:18px;font-weight:700">${round(summary.totalKcal)}</div>
        </div>
        <div style="font-size:11px;color:var(--text-3)">${summary.daysWithData}/7 giorni con dati. Imposta un obiettivo in Profilo per vedere il delta.</div>
      ` : `
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px">
          <div style="font-size:13px;color:var(--text-2)">Calorie totali</div>
          <div style="font-size:18px;font-weight:700">${round(summary.totalKcal)} <span style="font-size:13px;color:var(--text-3);font-weight:500">/ ${round(summary.goalSum)}</span></div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">
          <div style="font-size:13px;color:var(--text-2)">${esc(deltaLabel)}</div>
          <div style="font-size:16px;font-weight:700;color:${deltaColor}">${deltaSign}${round(summary.deltaTotal)} kcal</div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:baseline;font-size:11px;color:var(--text-3);padding-top:8px;border-top:1px solid var(--border)">
          <div>Media giornaliera: ${round(consumedAvgPerDay)} kcal</div>
          <div>${summary.daysWithData}/7 giorni</div>
        </div>
      `}
    </div>
  `;

  const html = `
    <h2 class="sheet-title">Calendario</h2>
    <p class="sheet-sub">Tap su un giorno per visualizzarlo. Disponibile da ${DIARY_RETENTION_DAYS} giorni fa a ${DIARY_RETENTION_DAYS} giorni avanti.</p>

    <div class="cal-grid">
      ${dayHead.map(d => `<div class="cal-head">${d}</div>`).join('')}
    </div>
    ${weeksHtml}

    ${summaryHtml}

    <button class="btn btn-secondary" id="cal-jump-today">Vai a oggi</button>
  `;
  openSheet(html);

  document.querySelectorAll('[data-cal-pick]').forEach(b => {
    b.onclick = async () => {
      const d = b.dataset.calPick;
      state.date = d;
      await loadDiary(state.date);
      closeSheet();
      render();
    };
  });
  const jumpToday = document.getElementById('cal-jump-today');
  if (jumpToday) jumpToday.onclick = async () => {
    state.date = todayISO();
    await loadDiary(state.date);
    closeSheet();
    render();
  };
}

async function populateWeekSummaryCard() {
  const el = document.getElementById('week-summary-card');

  try {
    const summary = await computeWeekSummary(state.date);
    const monthLabels = ['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];
    const fromD = parseInt(summary.from.slice(8,10), 10);
    const toD = parseInt(summary.to.slice(8,10), 10);
    const fromM = monthLabels[parseInt(summary.from.slice(5,7), 10) - 1];
    const toM = monthLabels[parseInt(summary.to.slice(5,7), 10) - 1];
    const range = fromM === toM ? `${fromD}–${toD} ${toM}` : `${fromD} ${fromM} – ${toD} ${toM}`;

    const deltaLabel = summary.deltaTotal > 0 ? 'eccesso' : (summary.deltaTotal < 0 ? 'difetto' : 'in linea');

    el.innerHTML = `
      <div style="font-size:11px;color:var(--text-3);font-weight:600;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:10px">Lun – Dom · ${esc(range)}</div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">
        <div style="font-size:13px;color:var(--text-2)">Assunte</div>
        <div style="font-size:18px;font-weight:700">${round(summary.totalKcal)} <span style="font-size:13px;color:var(--text-3);font-weight:500">/ ${round(summary.goalSum)}</span></div>
      </div>

        <div style="font-size:17px;font-weight:700;color:${deltaColor}">${deltaSign}${round(summary.deltaTotal)} kcal</div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;font-size:11px;color:var(--text-3);padding-top:10px;border-top:1px solid var(--border)">

function openTemplatesSheet(selectMealTarget = null, filter = '') {
  const all = state.templates;
  const renderListData = (filterStr) => {
    const fLow = stripAccents((filterStr || '').trim().toLowerCase());
    const list = !fLow ? all : all.filter(t => {
      const itemNames = (t.items || []).map(it => (it.food && it.food.name) || '').join(' ');
      const hay = stripAccents(((t.name || '') + ' ' + itemNames).toLowerCase());
      return fLow.split(/\s+/).every(tok => hay.includes(tok));
    });
    return {
      sub: selectMealTarget
        ? 'Tocca un pasto per aggiungerlo al diario.'
        : `${all.length} pasti${fLow ? ` · ${list.length} risultati` : ' template riutilizzabili'}`,
      html: all.length === 0
        ? `<div class="subtle-list-empty">Nessun pasto salvato</div>`
        : list.length === 0
          ? `<div class="subtle-list-empty">Nessun risultato</div>`
          : list.slice(0, 100).map(t => {
              const kcal = t.items.reduce((s, it) => s + it.food.kcal * it.grams / 100, 0);
              return `<div style="display:flex;align-items:center;gap:12px;padding:12px 6px;border-bottom:1px solid var(--border);cursor:${selectMealTarget ? 'pointer' : 'default'}" ${selectMealTarget ? `data-pick-tpl="${esc(t.id)}"` : ''}>
                <div style="flex:1;min-width:0">
                  <div style="font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(t.name)}</div>
                  <div style="font-size:12px;color:var(--text-2);margin-top:2px">${t.items.length} alimenti · ${round(kcal)} kcal</div>
                </div>
                ${!selectMealTarget ? `
                  <button class="icon-btn" data-edit-tpl="${esc(t.id)}" aria-label="Modifica">${I.edit}</button>
                  <button class="icon-btn" data-del-tpl="${esc(t.id)}" aria-label="Elimina" style="color:var(--text-3)">${I.trash}</button>
                ` : `<div class="chev">${I.right}</div>`}
              </div>`;
            }).join('') + (list.length > 100 ? `<div style="padding:14px;text-align:center;font-size:12px;color:var(--text-3)">${list.length - 100} altri risultati. Affina la ricerca.</div>` : ''),
    };
  };
  const initial = renderListData(filter);
  const html = `
    <h2 class="sheet-title">Pasti salvati</h2>
    <p class="sheet-sub" id="tpl-sub">${initial.sub}</p>
    ${!selectMealTarget ? `<button class="btn btn-primary" id="new-tpl" style="margin-bottom:10px">${I.plus}<span>Nuovo pasto</span></button>` : ''}
    ${all.length > 0 ? `
    <div class="field" style="margin-bottom:10px">
      <input class="input" id="tpl-search" placeholder="Cerca tra i tuoi pasti..." value="${esc(filter)}" autocomplete="off" autocapitalize="off" autocorrect="off">
    </div>` : ''}
    <div id="tpl-list" style="max-height:60vh;overflow-y:auto">${initial.html}</div>
  `;
  openSheet(html);
  const listEl = document.getElementById('tpl-list');
  const bindRowActions = () => {
    listEl.querySelectorAll('[data-edit-tpl]').forEach(b => {
      b.onclick = () => openTemplateEditor(state.templates.find(t => t.id === b.dataset.editTpl));
    });
    listEl.querySelectorAll('[data-del-tpl]').forEach(b => {
      b.onclick = async () => {
        if (!confirm('Eliminare questo pasto?')) return;
        const scrollTop = listEl.scrollTop;
        await deleteTemplate(b.dataset.delTpl);
        await loadTemplates();
        // Aggiorna lista interna
        all.length = 0;
        Array.prototype.push.apply(all, state.templates);
        const cur = document.getElementById('tpl-search');
        const updated = renderListData(cur ? cur.value : '');
        const subEl = document.getElementById('tpl-sub');
        if (subEl) subEl.textContent = updated.sub;
        listEl.innerHTML = updated.html;
        listEl.scrollTop = scrollTop;
        bindRowActions();
      };
    });
    if (selectMealTarget) {
      listEl.querySelectorAll('[data-pick-tpl]').forEach(el => {
        el.onclick = async () => {
          const t = state.templates.find(x => x.id === el.dataset.pickTpl);
          if (!t) return;
          await applyTemplate(t, selectMealTarget);
          closeSheet();
          toast(`"${t.name}" aggiunto`);
          render();
        };
      });
    }
  };
  bindRowActions();
  const searchInput = document.getElementById('tpl-search');
  if (searchInput) {
    let t;
    searchInput.oninput = () => {
      clearTimeout(t);
      t = setTimeout(() => {
        const updated = renderListData(searchInput.value);
        const subEl = document.getElementById('tpl-sub');
        if (subEl) subEl.textContent = updated.sub;
        listEl.innerHTML = updated.html;
        bindRowActions();
      }, 180);
    };
  }
  const nb = document.getElementById('new-tpl');
  if (nb) nb.onclick = () => openTemplateEditor(null);
}

  state.editTemplate = tpl ? { ...tpl, items: [...tpl.items] } : { name: '', items: [] };
  renderTemplateEditor();
}

    <div style="margin-bottom:12px">

    <button class="btn btn-ghost" id="tpl-back" style="margin-top:6px">Annulla</button>

  document.querySelectorAll('[data-tpl-del]').forEach(b => {
    b.onclick = () => {
      state.editTemplate.items.splice(+b.dataset.tplDel, 1);
      renderTemplateEditor();
    };
  });
  document.getElementById('tpl-save').onclick = async () => {
    const nameEl = document.getElementById('tpl-name');
    const name = (nameEl ? nameEl.value : '').trim();
    if (!name) { toast('Nome obbligatorio'); return; }
    if (state.editTemplate.items.length === 0) { toast('Aggiungi almeno un alimento'); return; }
    await saveTemplate({ id: state.editTemplate.id || null, name, items: state.editTemplate.items });
    await loadTemplates();
    toast('Pasto salvato');
    openTemplatesSheet();
  };
  document.getElementById('tpl-name').oninput = (e) => { state.editTemplate.name = e.target.value; };

function openTemplatePicker() {
  // Save current template name from DOM
  const nameEl = document.getElementById('tpl-name');
  if (nameEl) state.editTemplate.name = nameEl.value;
  const html = `
    <h2 class="sheet-title">Aggiungi alimento</h2>
    <p class="sheet-sub">Cerca o scegli dai tuoi alimenti.</p>
    <div class="search-input-wrap" style="margin-bottom:14px">
      ${I.search}
      <input type="search" class="search-input" id="tplq" placeholder="Cerca...">
    </div>
    <div id="tpl-picker-results"></div>
    <button class="btn btn-ghost" id="tplp-back" style="margin-top:14px">Annulla</button>
  `;
  openSheet(html);
  document.getElementById('tplp-back').onclick = () => renderTemplateEditor();
  const input = document.getElementById('tplq');
  const out = document.getElementById('tpl-picker-results');
  const initial = state.customFoods.slice(0, 8);
  renderList(initial);
  const run = debounce(async (q) => {
    if (!q || q.length < 2) { renderList(state.customFoods.slice(0, 8)); return; }
    out.innerHTML = `<div class="spinner"></div>`;
    try {
      const off = await searchOFF(q).catch(() => []);
      const customs = state.customFoods.filter(f => (f.name || '').toLowerCase().includes(q.toLowerCase())).map(f => ({...f, _custom: true}));
      renderList([...customs, ...off]);
    } catch (_) { out.innerHTML = `<div class="state">Errore di rete</div>`; }
  }, 300);
  input.oninput = (e) => run(e.target.value);
  function renderList(arr) {
    if (arr.length === 0) {
      out.innerHTML = `<div class="state"><div>Nessun risultato</div></div>`;
      return;
    }
    out.innerHTML = arr.map((f, i) => `
      <div class="result" data-pick-tpl-item="${i}">
        ${f.image_url ? `<img class="result-img" src="${esc(f.image_url)}" onerror="this.outerHTML='<div class=\\'result-img-placeholder\\'>${I.leaf}</div>'">` : `<div class="result-img-placeholder">${I.leaf}</div>`}
        <div class="result-main">
          <div class="result-name">${esc(f.name)}${f._custom ? '<span class="result-tag">Mio</span>' : ''}${f._ai ? '<span class="result-tag" style="background:rgba(0,224,255,0.12);color:#00E0FF">AI</span>' : ''}</div>
          <div class="result-meta">${esc(f.brand || 'Senza marca')}</div>
        </div>
        <div class="result-kcal">${round(f.kcal)}<div style="font-size:10px;color:var(--text-3);font-weight:400">kcal/100g</div></div>
      </div>`).join('');
    out.querySelectorAll('[data-pick-tpl-item]').forEach(el => {
      el.onclick = () => askGramsForTemplate(arr[+el.dataset.pickTplItem]);
    });
  }
}
function askGramsForTemplate(food) {
  const html = `
    <h2 class="sheet-title">Quantità</h2>
    <p class="sheet-sub">${esc(food.name)}</p>
    <div class="field">
      <label>Grammi</label>
      <input class="input" type="number" id="tg" min="1" max="5000" value="100">

    <button class="btn btn-primary" id="tg-ok">Aggiungi</button>
    <button class="btn btn-ghost" id="tg-cancel" style="margin-top:6px">Annulla</button>

  openSheet(html);
  document.getElementById('tg-cancel').onclick = () => renderTemplateEditor();

/* ═══════════════════════════════════════════════════════════
   CLOUD BACKUP — GitHub Gist (riusabile per altre app)
   ═══════════════════════════════════════════════════════════
   Modulo autonomo pensato per essere copiato tra app diverse.
   Una stessa coppia (token, gistId) può ospitare backup di più
   app distinte: ogni app scrive un file col nome `${appId}.json`
   all'interno dello stesso gist.

   USO IN ALTRA APP:
   1. Copia l'intero blocco cloudBackup (indipendente dal resto).
   2. Cambia APP_ID in app.js della nuova app.
   3. La stessa UI "Gestisci sincronizzazione cloud" funziona ovunque.
   ═══════════════════════════════════════════════════════════ */
const APP_ID = 'nutrilog';   // ⚠ cambia per altre app (es. 'sleeplog')
const APP_LABEL = 'NutriLog'; // etichetta user-facing
const APP_VERSION = '1.33.0';

const cloudBackup = {
  // --- Config storage (localStorage diretto, indipendente da sg/ss) ---
  CFG_KEY: 'cloudBackup::config', // non prefissato LS_PREFIX: è config globale multi-app

  getConfig() {
    try {
      const raw = localStorage.getItem(this.CFG_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (_) { return null; }
  },
  setConfig(cfg) {
    try { localStorage.setItem(this.CFG_KEY, JSON.stringify(cfg)); return true; }
    catch (e) { dlog('ERR saveCloudCfg: ' + e.message); return false; }
  },
  clearConfig() {
    try { localStorage.removeItem(this.CFG_KEY); return true; } catch (_) { return false; }
  },
  isConfigured() {
    const c = this.getConfig();
    return !!(c && c.token && c.gistId);
  },

  // --- Low-level GitHub API ---
  async _ghFetch(path, opts = {}) {
    const cfg = this.getConfig();
    if (!cfg || !cfg.token) throw new Error('Token GitHub non configurato');
    const method = opts.method || 'GET';
    dlog('GH ' + method + ' ' + path);

    const headers = {
      'Accept': 'application/vnd.github+json',
      'Authorization': 'Bearer ' + cfg.token,
      'X-GitHub-Api-Version': '2022-11-28',
    };
    if (opts.body) headers['Content-Type'] = 'application/json';
    if (opts.headers) {
      for (const k of Object.keys(opts.headers)) headers[k] = opts.headers[k];
    }

    const buildInit = (withSignal) => {
      const init = { method, headers };
      if (opts.body != null) init.body = opts.body;
      if (withSignal) {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 20000);
        init.signal = ctrl.signal;
        init._timer = timer;
      }
      return init;
    };

    const useSignal = !window._ghAbortBroken;
    let init = buildInit(useSignal);
    let res;
    try {
      res = await fetch('https://api.github.com' + path, init);
    } catch (e) {
      if (init._timer) clearTimeout(init._timer);
      dlog('GH ' + path + ' FETCH FAIL: ' + (e.name || '') + ' / ' + (e.message || ''));
      if (useSignal && (e.name === 'DataCloneError' || /clone/i.test(e.message || ''))) {
        // WebView non supporta AbortSignal: marca e ritenta senza
        window._ghAbortBroken = true;
        dlog('GH ' + path + ': retry without AbortSignal (WebView quirk)');
        try {
          res = await fetch('https://api.github.com' + path, buildInit(false));
        } catch (e2) {
          dlog('GH ' + path + ' RETRY FAIL: ' + (e2.name || '') + ' / ' + (e2.message || ''));
          throw new Error('Rete: ' + (e2.message || 'fetch failed') + ' (' + path + ')');
        }
      } else if (e.name === 'AbortError') {
        throw new Error('Timeout su ' + path + ' (20s)');
      } else {
        throw new Error('Rete: ' + (e.message || 'fetch failed') + ' (' + path + ')');
      }
    }
    if (init._timer) clearTimeout(init._timer);

    if (!res.ok) {
      let msg = `GitHub ${res.status}`;
      try { const j = await res.json(); if (j.message) msg += `: ${j.message}`; } catch (_) {}
      if (res.status === 401) msg += ' (token non valido o scaduto)';
      if (res.status === 403) msg += ' (permessi insufficienti — serve scope "gist")';
      if (res.status === 404) msg += ' (gist non trovato)';
      throw new Error(msg);
    }
    if (res.status === 204) return null;
    return await res.json();
  },

  // --- Token validation ---
  async validateToken(token) {
    dlog('GH validateToken: start');
    const baseHeaders = {
      'Accept': 'application/vnd.github+json',
      'Authorization': 'Bearer ' + token,
    };

    const tryFetch = async (withSignal) => {
      const init = { method: 'GET', headers: baseHeaders };
      let timer = null;
      if (withSignal) {
        const ctrl = new AbortController();
        timer = setTimeout(() => ctrl.abort(), 15000);
        init.signal = ctrl.signal;
      }
      try {
        const r = await fetch('https://api.github.com/user', init);
        if (timer) clearTimeout(timer);
        return r;
      } catch (e) {
        if (timer) clearTimeout(timer);
        throw e;
      }
    };

    let res;
    const useSignal = !window._ghAbortBroken;
    try {
      res = await tryFetch(useSignal);
    } catch (e) {
      dlog('GH validateToken FETCH FAIL: ' + (e.name || '') + ' / ' + (e.message || ''));
      if (useSignal && (e.name === 'DataCloneError' || /clone/i.test(e.message || ''))) {
        window._ghAbortBroken = true;
        dlog('GH validateToken: retry without AbortSignal (WebView quirk detected)');
        try { res = await tryFetch(false); }
        catch (e2) {
          dlog('GH validateToken RETRY FAIL: ' + (e2.name || '') + ' / ' + (e2.message || ''));
          throw new Error('Rete: ' + (e2.message || 'fetch failed') + ' — impossibile contattare api.github.com');
        }
      } else if (e.name === 'AbortError') {
        throw new Error('Timeout: GitHub non risponde (15s)');
      } else {
        throw new Error('Rete: ' + (e.message || 'fetch failed'));
      }
    }
    dlog('GH validateToken: HTTP ' + res.status);
    if (!res.ok) {
      if (res.status === 401) throw new Error('Token non valido');
      throw new Error('GitHub HTTP ' + res.status);
    }
    let u;
    try { u = await res.json(); }
    catch (e) { throw new Error('Risposta GitHub non parsabile'); }
    const scopes = (res.headers.get('x-oauth-scopes') || '').split(',').map(s => s.trim());
    dlog('GH scopes: ' + JSON.stringify(scopes));
    if (scopes.length && scopes[0] !== '' && !scopes.includes('gist')) {
      throw new Error('Al token manca lo scope "gist". Generane uno nuovo selezionando solo "gist".');
    }
    return { login: u.login, avatar_url: u.avatar_url };
  },

  // --- Gist lifecycle ---
  async createGist(description = 'Personal app backups') {
    const data = await this._ghFetch('/gists', {
      method: 'POST',
      body: JSON.stringify({
        description,
        public: false,
        files: {
          'README.md': {
            content: `# Personal app backups\n\nThis secret gist holds backups for apps built by the owner.\nEach file is named after the app that owns it.\n\nCreated: ${new Date().toISOString()}\n`,
          }
        },
      }),
    });
    return data.id;
  },

  async listAppsInGist() {
    const cfg = this.getConfig();
    if (!cfg || !cfg.gistId) return [];
    const g = await this._ghFetch('/gists/' + cfg.gistId);
    return Object.keys(g.files || {})
      .filter(f => f.endsWith('.json'))
      .map(f => ({
        filename: f,
        appId: f.replace(/\.json$/, ''),
        size: g.files[f].size,
      }));
  },

  // --- Backup read/write (app-scoped) ---
  /**
   * @param {string} appId identificativo dell'app (es. 'nutrilog')
   * @param {object} payload dati da salvare (verrà serializzato in JSON)
   */
  async push(appId, payload) {
    const cfg = this.getConfig();
    if (!cfg || !cfg.gistId) throw new Error('Gist non configurato');
    const filename = `${appId}.json`;
    const wrapped = {
      appId,
      schemaVersion: 1,
      savedAt: new Date().toISOString(),
      payload,
    };
    await this._ghFetch('/gists/' + cfg.gistId, {
      method: 'PATCH',
      body: JSON.stringify({
        files: { [filename]: { content: JSON.stringify(wrapped, null, 2) } }
      }),
    });
    // Aggiorna metadata last-sync
    const c2 = this.getConfig() || {};
    c2.lastSync = c2.lastSync || {};
    c2.lastSync[appId] = new Date().toISOString();
    this.setConfig(c2);
    return wrapped;
  },

  async pull(appId) {
    const cfg = this.getConfig();
    if (!cfg || !cfg.gistId) throw new Error('Gist non configurato');
    const filename = `${appId}.json`;
    const g = await this._ghFetch('/gists/' + cfg.gistId);
    const file = (g.files || {})[filename];
    if (!file) return null;
    // Se il content è stato troncato (>1MB), recupera dal raw_url
    let content = file.content;
    if (file.truncated && file.raw_url) {
      const r = await fetch(file.raw_url);
      if (!r.ok) throw new Error('Impossibile leggere il file del gist');
      content = await r.text();
    }
    try { return JSON.parse(content); }
    catch (e) { throw new Error('File di backup corrotto: ' + e.message); }
  },
};

/* ─── EXPORT / IMPORT HANDLERS (UI) ─────────────────────── */
function cloudStatusLabel() {
  if (!cloudBackup.isConfigured()) return 'Non configurato';
  const cfg = cloudBackup.getConfig();
  const last = cfg.lastSync && cfg.lastSync[APP_ID];
  if (!last) return `Connesso come @${cfg.githubLogin || '?'}`;
  const ago = timeAgo(new Date(last));
  return `@${cfg.githubLogin || '?'} · ultimo sync ${ago}`;
}
function timeAgo(d) {
  const s = Math.floor((Date.now() - d.getTime()) / 1000);
  if (s < 60) return 'pochi secondi fa';
  if (s < 3600) return Math.floor(s / 60) + ' min fa';
  if (s < 86400) return Math.floor(s / 3600) + ' h fa';
  const days = Math.floor(s / 86400);
  if (days === 1) return 'ieri';
  if (days < 7) return days + ' giorni fa';
  return d.toLocaleDateString('it-IT', { day: 'numeric', month: 'short' });
}

async function cloudPull() {
  if (!confirm('Scaricare l\'ultimo backup dal cloud? I dati verranno uniti a quelli locali (nessuna sovrascrittura).')) return;
  openSheet(`<h2 class="sheet-title">Recupero da cloud...</h2><div class="spinner"></div>`);

    const wrapped = await cloudBackup.pull(APP_ID);
    if (!wrapped) {
      closeSheet();
      toast('Nessun backup cloud trovato per questa app');
      return;
    }
    const data = wrapped.payload;
    if (!data || data.format !== 'nutrilog-backup') {
      closeSheet();

    const res = await importUserData(data, { mode: 'merge' });

      <div style="flex:1">
        <div class="dash-toggle-label">${cfg.resizeLocked ? '🔒' : '🔓'} ${cfg.resizeLocked ? 'Sblocca' : 'Blocca'} ridimensionamento</div>
        <div class="dash-toggle-desc">${cfg.resizeLocked ? 'Maniglie nascoste, niente modifiche accidentali.' : 'Maniglie visibili, puoi ridimensionare le card.'}</div>
      </div>
      <input type="checkbox" id="dash-lock-toggle" ${cfg.resizeLocked ? '' : 'checked'}>
    </label>
    <button class="btn btn-ghost" id="dash-reset-heights" type="button">Reset altezze card</button>
    <button class="btn btn-primary" id="dash-cfg-close" type="button" style="margin-top:6px">Fatto</button>
  `;
  openSheet(html);

  // Card toggle
  document.querySelectorAll('[data-dash-toggle]').forEach(cb => {
    cb.addEventListener('change', () => {
      const cur = getDashboardCfg();
      cur.show[cb.dataset.dashToggle] = cb.checked;
      setDashboardCfg(cur);
    });
  });

  // Meal name rename (su blur)
  document.querySelectorAll('[data-meal-name]').forEach(inp => {
    inp.addEventListener('blur', () => {
      const id = inp.dataset.mealName;
      const newName = (inp.value || '').trim();
      if (!newName) { inp.value = (getMealsCfg().find(m => m.id === id) || {}).name || ''; return; }
      const ms = getMealsCfg();
      const idx = ms.findIndex(m => m.id === id);
      if (idx >= 0) {
        ms[idx].name = newName;
        setMealsCfg(ms);
      }
    });
  });

  // Visibility toggle
  document.querySelectorAll('[data-meal-vis]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.mealVis;
      const ms = getMealsCfg();
      const idx = ms.findIndex(m => m.id === id);
      if (idx >= 0) {
        ms[idx].visible = !(ms[idx].visible !== false);
        setMealsCfg(ms);
        openDashCfgSheet();
      }
    });
  });

  // Delete custom meal
  document.querySelectorAll('[data-meal-del]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.mealDel;
      if (!confirm('Eliminare questo pasto?\n\nLe voci di diario già aggiunte qui non verranno cancellate, ma il pasto non sarà più visibile e modificabile.')) return;
      const ms = getMealsCfg().filter(m => m.id !== id);
      setMealsCfg(ms);
      openDashCfgSheet();
    });
  });

  // Add meal
  document.getElementById('add-meal-btn').onclick = () => {
    const name = prompt('Nome del nuovo pasto:', '');
    if (!name || !name.trim()) return;
    const trimmed = name.trim();
    if (trimmed.length > 30) { toast('Nome troppo lungo (max 30 caratteri)'); return; }
    const ms = getMealsCfg();
    if (ms.some(m => m.name.toLowerCase() === trimmed.toLowerCase())) {
      toast('Esiste già un pasto con questo nome');
      return;
    }
    const newId = 'm-' + uid();
    ms.push({ id: newId, name: trimmed, visible: true });
    setMealsCfg(ms);
    openDashCfgSheet();
  };

  // Drag-to-reorder
  const mealsList = document.getElementById('meals-list');
  let draggedId = null;
  if (mealsList) {
    mealsList.querySelectorAll('.meal-cfg-row').forEach(row => {
      row.addEventListener('dragstart', (e) => {
        draggedId = row.dataset.mealId;
        row.classList.add('dragging');
        if (e.dataTransfer) {
          e.dataTransfer.effectAllowed = 'move';
          try { e.dataTransfer.setData('text/plain', draggedId); } catch (_) {}
        }
      });
      row.addEventListener('dragend', () => {
        row.classList.remove('dragging');
        draggedId = null;
      });
      row.addEventListener('dragover', (e) => {
        e.preventDefault();
        if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
      });
      row.addEventListener('drop', (e) => {
        e.preventDefault();
        const targetId = row.dataset.mealId;
        if (!draggedId || draggedId === targetId) return;
        const ms = getMealsCfg();
        const fromIdx = ms.findIndex(m => m.id === draggedId);
        const toIdx = ms.findIndex(m => m.id === targetId);
        if (fromIdx < 0 || toIdx < 0) return;
        const [moved] = ms.splice(fromIdx, 1);
        ms.splice(toIdx, 0, moved);
        setMealsCfg(ms);
        openDashCfgSheet();
      });
    });
  }

  document.getElementById('dash-reset-heights').onclick = () => {
    const cur = getDashboardCfg();
    cur.heights = {};
    setDashboardCfg(cur);
    toast('Altezze ripristinate');
  };
  const lockToggle = document.getElementById('dash-lock-toggle');
  if (lockToggle) {
    lockToggle.addEventListener('change', () => {
      const cur = getDashboardCfg();
      cur.resizeLocked = !lockToggle.checked;
      setDashboardCfg(cur);
      openDashCfgSheet();
    });
  }
  document.getElementById('dash-cfg-close').onclick = () => {
    closeSheet();
    render();
  };
}

async function openSnapshotsSheet() {
  openSheet(`
    <h2 class="sheet-title">Cronologia backup</h2>
    <p class="sheet-sub">Caricamento...</p>
    <div class="spinner"></div>
  `);
  const snapshots = await listSnapshots();
  const fmtDate = (iso) => {
    try {
      const d = new Date(iso);
      const dd = String(d.getDate()).padStart(2, '0');
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const hh = String(d.getHours()).padStart(2, '0');
      const min = String(d.getMinutes()).padStart(2, '0');
      return `${dd}/${mm} alle ${hh}:${min}`;
    } catch (_) { return iso; }
  };
  const fmtRelative = (iso) => {
    try {
      const diff = (Date.now() - new Date(iso).getTime()) / 1000;
      if (diff < 60) return 'ora';
      if (diff < 3600) return `${Math.floor(diff/60)}m fa`;
      if (diff < 86400) return `${Math.floor(diff/3600)}h fa`;
      return `${Math.floor(diff/86400)}g fa`;
    } catch (_) { return ''; }
  };

  let body;
  if (snapshots.length === 0) {
    body = `
      <div class="state" style="padding:40px 20px">
        ${I.box}
        <div style="margin-top:14px">Nessun backup salvato</div>
        <div style="font-size:12px;color:var(--text-3);margin-top:6px;line-height:1.5">L'app salva automaticamente una versione dei tuoi dati ogni 30 minuti.<br>Riapri l'app dopo aver usato NutriLog per qualche giorno e troverai qui i backup.</div>
      </div>
    `;
  } else {
    body = `
      <p style="font-size:12px;color:var(--text-3);margin:0 0 14px;line-height:1.5">Le ultime ${snapshots.length} versioni dei tuoi dati. Tap su una per ripristinarla. Massimo ${SNAPSHOT_MAX} salvate, le più vecchie vengono sostituite.</p>
      <div style="display:flex;flex-direction:column;gap:10px">
        ${snapshots.map((s, i) => `
          <div class="copy-day-row" data-restore-snap="${esc(s.ts)}">
            <div class="copy-day-main">
              <div class="copy-day-title">${i === 0 ? '<span style="color:var(--accent);font-weight:600">●</span> ' : ''}${esc(fmtDate(s.createdAt))}<span class="copy-day-sub"> · ${esc(fmtRelative(s.createdAt))}</span></div>
              <div class="copy-day-preview">${s.stats.cf || 0} alimenti · ${s.stats.tpl || 0} pasti · ${s.stats.diaryDays || 0} giorni · ${s.stats.diaryItems || 0} voci diario</div>
            </div>
            <button class="icon-btn" data-del-snap="${esc(s.ts)}" aria-label="Elimina" style="color:var(--text-3)" onclick="event.stopPropagation()">${I.trash}</button>
          </div>
        `).join('')}
      </div>
    `;
  }

  openSheet(`
    <h2 class="sheet-title">Cronologia backup</h2>
    ${body}
  `);

  document.querySelectorAll('[data-restore-snap]').forEach(row => {
    row.onclick = async () => {
      const ts = row.dataset.restoreSnap;
      if (!confirm('Ripristinare questa versione?\n\nI dati attuali verranno sostituiti con quelli del backup. Verrà creato automaticamente un nuovo punto di ripristino prima della sostituzione.')) return;
      // Crea un nuovo snapshot prima del ripristino (in caso l'utente cambi idea)
      await saveSnapshot();
      const ok = await restoreSnapshot(ts);
      if (ok) {
        closeSheet();
        toast('Backup ripristinato');
        render();
        // Forza push al cloud
        scheduleCloudAutoSync();
      } else {
        toast('Ripristino fallito');
      }
    };
  });

  document.querySelectorAll('[data-del-snap]').forEach(btn => {
    btn.onclick = async (e) => {
      e.stopPropagation();
      const ts = btn.dataset.delSnap;
      if (!confirm('Eliminare questo backup?')) return;
      await deleteSnapshot(ts);
      openSnapshotsSheet();
    };
  });
}

  const tests = [];

  // Test 1: write
  const w = await ss(testKey, testPayload);

  if (w) {

    <button class="btn btn-ghost" id="dbg-close" style="margin-top:6px">Chiudi</button>

  document.getElementById('dbg-refresh').onclick = () => openDebugSheet();

function suggestMealByTime() {
  const h = new Date().getHours();
  // Logica pratica per pasti italiani:
  //   05-10  → Colazione
  //   10-15  → Pranzo  (include la fascia "sto per pranzare" delle 11-12)
  //   15-18  → Spuntino (merenda pomeridiana)
  //   18-23  → Cena
  //   23-05  → Cena (rientri tardi, ultimo pasto)
  if (h >= 5 && h < 10) return 'breakfast';
  if (h >= 10 && h < 15) return 'lunch';
  if (h >= 15 && h < 18) return 'snack';
  return 'dinner'; // 18-23 e 23-05
}

/* ─── CSV EXPORT/IMPORT ALIMENTI ──────────────────────── */
const CSV_FIELDS = ['name', 'brand', 'kcal', 'protein', 'carbs', 'fat', 'fiber', 'sugar', 'sodium'];
const CSV_HEADER_IT = ['Nome', 'Marca', 'Calorie', 'Proteine', 'Carboidrati', 'Grassi', 'Fibre', 'Zuccheri', 'Saturi'];

function csvEscape(v) {
  const s = String(v == null ? '' : v);
  if (/[",\n;]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}
function buildCSV(rows, includeBuiltins = true) {
  const out = [CSV_HEADER_IT.join(';')];
  // BOM per Excel + delimiter ; (locale italiano)
  for (const r of rows) {
    out.push(CSV_FIELDS.map(f => csvEscape(r[f])).join(';'));
  }
  return '\uFEFF' + out.join('\r\n') + '\r\n';
}

function parseCSV(text) {
  // Rimuovi BOM
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  // Detect delimiter: prima riga, scegli tra ; e ,
  const firstLine = text.split(/\r?\n/, 1)[0] || '';
  const delim = firstLine.includes(';') ? ';' : ',';

  const rows = [];
  let i = 0, field = '', row = [], inQuotes = false;
  while (i < text.length) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i += 2; continue; }
        inQuotes = false; i++; continue;
      }
      field += c; i++; continue;
    }
    if (c === '"') { inQuotes = true; i++; continue; }
    if (c === delim) { row.push(field); field = ''; i++; continue; }
    if (c === '\n' || c === '\r') {
      row.push(field); field = '';
      if (row.length > 1 || row[0] !== '') rows.push(row);
      row = [];
      if (c === '\r' && text[i + 1] === '\n') i++;
      i++; continue;
    }
    field += c; i++;
  }
  if (field !== '' || row.length) { row.push(field); if (row.length > 1 || row[0] !== '') rows.push(row); }

  if (rows.length === 0) return [];
  // Header detection: cerca chiavi italiane o inglesi
  const header = rows[0].map(h => h.trim().toLowerCase());
  const headerMap = {
    nome: 'name', name: 'name',
    marca: 'brand', brand: 'brand', brands: 'brand',
    calorie: 'kcal', kcal: 'kcal', calories: 'kcal', energia: 'kcal',
    proteine: 'protein', protein: 'protein', proteins: 'protein',
    carboidrati: 'carbs', carbs: 'carbs', carbohydrates: 'carbs',
    grassi: 'fat', fat: 'fat', lipidi: 'fat',
    fibre: 'fiber', fiber: 'fiber', fibra: 'fiber',
    zuccheri: 'sugar', sugar: 'sugar', sugars: 'sugar', zucchero: 'sugar',
    sodio: 'sodium', sodium: 'sodium', sale: 'sodium',
  };
  const cols = header.map(h => headerMap[h] || null);
  if (!cols.includes('name') || !cols.includes('kcal')) {
    throw new Error('Il CSV deve avere almeno colonne "Nome" e "Calorie"');
  }
  const out = [];
  for (let r = 1; r < rows.length; r++) {
    const obj = {};
    for (let c = 0; c < cols.length; c++) {
      if (!cols[c]) continue;
      let v = rows[r][c] != null ? String(rows[r][c]).trim() : '';
      if (cols[c] === 'name' || cols[c] === 'brand') obj[cols[c]] = v;
      else {
        v = v.replace(',', '.'); // virgola decimale italiana
        obj[cols[c]] = num(v, 0);
      }
    }
    if (obj.name) out.push(obj);
  }
  return out;
}

function downloadCSV(filename, text) {
  const blob = new Blob([text], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 500);
}

function pickCSVFile() {
  return new Promise((resolve, reject) => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.csv,text/csv,application/vnd.ms-excel,application/csv';
    input.onchange = () => {
      const f = input.files && input.files[0];
      if (!f) return reject(new Error('Nessun file selezionato'));
      const reader = new FileReader();
      reader.onload = () => { try { resolve(reader.result); } catch (e) { reject(e); } };
      reader.onerror = () => reject(new Error('Errore lettura file'));
      reader.readAsText(f, 'UTF-8');
    };
    input.click();
  });
}

function compressImage(file, maxDim = 1280, quality = 0.85) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = () => { img.src = reader.result; };
    reader.onerror = () => reject(new Error('Errore lettura file'));
    img.onload = () => {
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        const scale = Math.min(maxDim / width, maxDim / height);
        width = Math.round(width * scale);
        height = Math.round(height * scale);
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      const dataUrl = canvas.toDataURL('image/jpeg', quality);
      const base64 = dataUrl.split(',')[1];
      resolve({ base64, mediaType: 'image/jpeg', dataUrl });
    };
    img.onerror = () => reject(new Error('Immagine non valida'));
    reader.readAsDataURL(file);
  });
}

const AI_CFG_KEY = 'aiVision::config';
function getAiConfig() {
  try {
    const raw = localStorage.getItem(AI_CFG_KEY);
    if (!raw) return null;
    const cfg = JSON.parse(raw);
    if (!cfg) return null;
    // Backward compatibility: alcune versioni salvano come 'geminiKey', altre come 'apiKey'
    const key = cfg.apiKey || cfg.geminiKey || '';
    return { ...cfg, apiKey: key, geminiKey: key };
  } catch (_) { return null; }
}
function setAiConfig(cfg) {
  try {
    // Salva entrambi i nomi per compatibilità con tutto il codice
    const key = cfg.apiKey || cfg.geminiKey || '';
    const normalized = { ...cfg, apiKey: key, geminiKey: key };
    localStorage.setItem(AI_CFG_KEY, JSON.stringify(normalized));
    return true;
  }
  catch (_) { return false; }
}

- Se la foto mostra un PIATTO: stima i valori per 100g del cibo principale. Imposta portionGrams a una stima ragionevole della porzione visibile.

async function callGeminiVision(apiKey, imgBase64, mediaType) {
  // Lista di modelli da provare in ordine. Free tier al 2026.
  // Se il primo fallisce con 404 (modello non disponibile), prova il successivo.
  const MODELS = [
    'gemini-2.5-flash-lite',
    'gemini-2.5-flash',
    'gemini-flash-latest',
  ];
  const body = {
    contents: [{
      role: 'user',
      parts: [
        { text: AI_PROMPT + '\n\nAnalizza questa foto e restituisci il JSON richiesto.' },
        { inline_data: { mime_type: mediaType, data: imgBase64 } }
      ]
    }],
    generationConfig: {
      response_mime_type: 'application/json',
      temperature: 0.2,
      max_output_tokens: 1024,
    },
  };

  let lastErr = null;
  for (const model of MODELS) {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`;
    let res;
    try {
      res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
    } catch (e) {
      lastErr = new Error('Rete: ' + (e.message || 'fetch failed'));
      continue;
    }
    if (res.ok) {
      const data = await res.json();
      dlog('Gemini OK with model: ' + model);
      const text = (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts || [])
        .map(p => p.text || '').join('').trim();
      if (!text) throw new Error('Risposta vuota da Gemini');
      const match = text.match(/\{[\s\S]*\}/);
      if (!match) throw new Error('JSON non trovato nella risposta');
      return JSON.parse(match[0]);
    }
    // Errore non-ok: estrai dettaglio
    let detail = '';
    try { const j = await res.json(); detail = (j.error && j.error.message) || ''; } catch (_) {}
    dlog(`Gemini ${model} HTTP ${res.status}: ${detail.slice(0,100)}`);
    // Casi che NON sono "modello non disponibile" → errore secco, no fallback
    if (res.status === 400 && /API key/i.test(detail)) throw new Error('API key non valida');
    if (res.status === 403) throw new Error('API key non autorizzata o quota esaurita');
    if (res.status === 429) throw new Error('Troppe richieste, attendi qualche secondo');
    // 404 = modello non disponibile, prova il prossimo
    if (res.status === 404) {
      lastErr = new Error(`Modello ${model} non disponibile`);
      continue;
    }
    // Altri errori → fail
    throw new Error(`Gemini HTTP ${res.status}${detail ? ': ' + detail : ''}`);
  }
  throw lastErr || new Error('Nessun modello Gemini disponibile');
}

      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center;margin-top:10px">
        <div>
          <input class="input pc-macro" type="number" min="0" max="200" step="0.1" id="pc-fiber" value="${round(food.fiber, 1)}" style="font-size:14px;font-weight:600;color:var(--text-2);text-align:center;padding:5px 4px;background:transparent;border:1px solid var(--border)">
          <div style="font-size:9.5px;color:var(--text-3);letter-spacing:0.1em;text-transform:uppercase;margin-top:3px">Fibre</div>
        </div>
        <div>
          <input class="input pc-macro" type="number" min="0" max="200" step="0.1" id="pc-sugar" value="${round(food.sugar, 1)}" style="font-size:14px;font-weight:600;color:var(--text-2);text-align:center;padding:5px 4px;background:transparent;border:1px solid var(--border)">
          <div style="font-size:9.5px;color:var(--text-3);letter-spacing:0.1em;text-transform:uppercase;margin-top:3px">Zucch</div>
        </div>
        <div>
          <input class="input pc-macro" type="number" min="0" max="10000" step="1" id="pc-sodium" value="${round(food.sodium, 0)}" style="font-size:14px;font-weight:600;color:var(--text-2);text-align:center;padding:5px 4px;background:transparent;border:1px solid var(--border)">
          <div style="font-size:9.5px;color:var(--text-3);letter-spacing:0.1em;text-transform:uppercase;margin-top:3px">Saturi g</div>
        </div>
      </div>
      <div style="font-size:10px;color:var(--text-3);text-align:center;margin-top:10px;letter-spacing:0.1em;text-transform:uppercase">Per 100g · tap per modificare</div>
    </div>

    <div class="field">
      <label>Nome alimento ${food.name ? '<span style="color:var(--text-3);font-weight:400;text-transform:none;letter-spacing:0">(rivedi se serve)</span>' : '<span style="color:var(--danger);font-weight:600">richiesto</span>'}</label>
      <input class="input" id="pc-name" value="${esc(food.name)}" placeholder="es. Insalata di pollo" required>
    </div>
    <div class="field">
      <label>Marca (opzionale)</label>
      <input class="input" id="pc-brand" value="${esc(food.brand)}" placeholder="">
    </div>
    <div class="field">
      <label>Quantità (grammi)</label>
      <input class="input" type="number" id="pc-grams" min="1" max="5000" value="${portion}">
    </div>

    <label style="display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--surface-2);border-radius:10px;margin-bottom:14px;cursor:pointer">
      <input type="checkbox" id="pc-save-custom" style="accent-color:var(--accent);width:18px;height:18px">
      <div style="flex:1">
        <div style="font-size:13.5px;font-weight:500">Salva tra "I miei alimenti"</div>
        <div style="font-size:12px;color:var(--text-2);margin-top:1px">Per riusarlo senza foto la prossima volta</div>
      </div>
    </label>

    <button class="btn btn-primary" id="pc-confirm">Aggiungi al diario</button>
    <button class="btn btn-ghost" id="pc-cancel" style="margin-top:6px">Annulla</button>
  `);

  document.getElementById('pc-cancel').onclick = closeSheet;

  // Auto-calcolo kcal quando l'utente modifica i macros (ma se modifica
  // direttamente kcal, quel valore vince fino al prossimo cambio macro)
  const pcKcal = document.getElementById('pc-kcal');
  const pcProtein = document.getElementById('pc-protein');
  const pcCarbs = document.getElementById('pc-carbs');
  const pcFat = document.getElementById('pc-fat');
  const recalcPcKcal = () => {
    const p = num(pcProtein.value);
    const c = num(pcCarbs.value);
    const f = num(pcFat.value);
    pcKcal.value = Math.round((p * 4 + c * 4 + f * 9) * 10) / 10;
  };
  [pcProtein, pcCarbs, pcFat].forEach(inp => {
    inp.addEventListener('input', recalcPcKcal);
  });
  document.getElementById('pc-confirm').onclick = async () => {
    const name = document.getElementById('pc-name').value.trim();
    if (!name) { toast('Inserisci un nome'); return; }
    const brand = document.getElementById('pc-brand').value.trim();
    const grams = num(document.getElementById('pc-grams').value, 0);
    if (grams <= 0) { toast('Quantità non valida'); return; }
    const saveCustom = document.getElementById('pc-save-custom').checked;

    // Leggi i valori macro/micro modificati dall'utente
    const editedKcal = round(num(document.getElementById('pc-kcal').value, food.kcal), 1);
    const editedProtein = round(num(document.getElementById('pc-protein').value, food.protein), 1);
    const editedCarbs = round(num(document.getElementById('pc-carbs').value, food.carbs), 1);
    const editedFat = round(num(document.getElementById('pc-fat').value, food.fat), 1);
    const editedFiber = round(num(document.getElementById('pc-fiber').value, food.fiber), 1);
    const editedSugar = round(num(document.getElementById('pc-sugar').value, food.sugar), 1);
    const editedSodium = round(num(document.getElementById('pc-sodium').value, food.sodium), 0);

    const finalFood = {
      ...food,
      name,
      brand,
      kcal: editedKcal,
      protein: editedProtein,
      carbs: editedCarbs,
      fat: editedFat,
      fiber: editedFiber,
      sugar: editedSugar,
      sodium: editedSodium,
    };
    if (saveCustom) {
      const saved = await saveCustomFood({
        name, brand,
        kcal: editedKcal, protein: editedProtein, carbs: editedCarbs, fat: editedFat,
        fiber: editedFiber, sugar: editedSugar, sodium: editedSodium,
      });
      await loadCustomFoods();
      finalFood.id = saved.id;
    }

    await addFoodToDiary(meal, finalFood, grams);
    closeSheet();
    toast(`"${name}" aggiunto`);
    if (state.tab !== 'today') state.tab = 'today';
    render();
  };
}

/* ─── COPY MEAL SHEET ──────────────────────────────────── */
async function openCopyMealSheet(meal) {
  const mealLabels = { breakfast: 'Colazione', lunch: 'Pranzo', dinner: 'Cena', snack: 'Spuntino' };
  openSheet(`
    <h2 class="sheet-title">Copia ${mealLabels[meal]}</h2>
    <p class="sheet-sub">Caricamento giorni precedenti...</p>
    <div class="spinner"></div>
  `);
  const days = await findRecentDaysWithMeal(meal, state.date, 14);
  const cur = state.diary[meal] || [];
  const hasCurrent = cur.length > 0;
  const pDate = prettyDate(state.date);

  let listHtml;
  if (days.length === 0) {
    listHtml = `<div class="subtle-list-empty" style="padding:40px 20px">Nessun pasto trovato<br><small style="color:var(--text-3);font-size:12px">Nei 60 giorni precedenti non hai registrato alimenti in ${mealLabels[meal].toLowerCase()}</small></div>`;
  } else {
    listHtml = days.map(d => {
      const pd = prettyDate(d.date);
      const kcal = d.items.reduce((s, it) => s + it.kcal * it.grams / 100, 0);
      const preview = d.items.slice(0, 3).map(it => it.name).join(' · ') +
        (d.items.length > 3 ? ` +${d.items.length - 3}` : '');
      return `
        <div class="copy-day-row" data-copy-src="${esc(d.date)}">
          <div class="copy-day-main">
            <div class="copy-day-title">${esc(pd.main)}<span class="copy-day-sub"> · ${esc(pd.sub)}</span></div>
            <div class="copy-day-preview">${esc(preview)}</div>
          </div>
          <div class="copy-day-kcal">${round(kcal)}<small>kcal</small></div>
        </div>`;
    }).join('');
  }

  openSheet(`
    <h2 class="sheet-title">Copia ${mealLabels[meal]}</h2>
    <p class="sheet-sub">Verso ${pDate.main.toLowerCase()} ${pDate.sub ? '· ' + pDate.sub : ''}. Seleziona il giorno da cui copiare.</p>

    ${hasCurrent ? `
      <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:rgba(255,176,32,0.08);border:1px solid rgba(255,176,32,0.2);border-radius:10px;margin-bottom:14px">
        <div style="flex:1;font-size:12px;color:var(--warning)">${cur.length} aliment${cur.length === 1 ? 'o' : 'i'} già present${cur.length === 1 ? 'e' : 'i'} in questo pasto</div>
        <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);cursor:pointer">
          <input type="checkbox" id="replace-mode" style="accent-color:var(--accent)">Sostituisci
        </label>
      </div>
    ` : ''}

    <div class="copy-day-list">${listHtml}</div>
  `);

  document.querySelectorAll('[data-copy-src]').forEach(row => {
    row.onclick = () => {
      const fromDate = row.dataset.copySrc;
      const replaceEl = document.getElementById('replace-mode');
      const mode = (replaceEl && replaceEl.checked) ? 'replace' : 'append';
      const dayData = days.find(d => d.date === fromDate);
      if (!dayData) return;
      // Apri secondo step: selezione alimenti
      openCopyMealItemsSheet(meal, fromDate, dayData.items, mode);
    };
  });
}

/* ─── COPY MEAL: step 2 - selezione alimenti ─────────── */
function openCopyMealItemsSheet(meal, fromDate, items, mode) {
  const mealLabels = { breakfast: 'Colazione', lunch: 'Pranzo', dinner: 'Cena', snack: 'Spuntino' };
  const pdFrom = prettyDate(fromDate);
  // Stato selezione: tutti selezionati di default
  const selected = new Set(items.map((_, i) => i));

  const renderRows = () => items.map((it, i) => {
    const isSel = selected.has(i);
    const kcal = (it.kcal || 0) * (it.grams || 0) / 100;
    return `
      <div class="copy-item-row ${isSel ? 'sel' : ''}" data-item-idx="${i}">
        <div class="copy-item-check">${isSel ? I.check : ''}</div>
        <div class="copy-item-main">
          <div class="copy-item-name">${esc(it.name)}</div>
          <div class="copy-item-sub">${round(it.grams)} g · ${round(kcal)} kcal</div>
        </div>
      </div>`;
  }).join('');

  const updateConfirmCount = () => {
    const btn = document.getElementById('copy-confirm-btn');
    if (btn) {
      const n = selected.size;
      btn.textContent = n === 0 ? 'Nessun alimento selezionato' : `Copia ${n} aliment${n === 1 ? 'o' : 'i'}`;
      btn.disabled = n === 0;
      btn.style.opacity = n === 0 ? '0.5' : '';
    }
  };

  openSheet(`
    <h2 class="sheet-title">Da ${esc(pdFrom.main)} ${esc(pdFrom.sub)}</h2>
    <p class="sheet-sub">${items.length} aliment${items.length === 1 ? 'o' : 'i'} in ${mealLabels[meal].toLowerCase()}. Seleziona quelli da copiare.</p>

    <div style="display:flex;gap:8px;margin-bottom:12px">
      <button class="btn btn-secondary" id="copy-all" style="flex:1;padding:8px;font-size:12px">Seleziona tutti</button>
      <button class="btn btn-secondary" id="copy-none" style="flex:1;padding:8px;font-size:12px">Deseleziona tutti</button>
    </div>

    <div class="copy-items-list" id="copy-items-list">${renderRows()}</div>

    <button class="btn btn-primary" id="copy-confirm-btn" style="margin-top:14px"></button>
    <button class="btn btn-ghost" id="copy-back" style="margin-top:6px">Indietro</button>
  `);

  const listEl = document.getElementById('copy-items-list');
  const bindRows = () => {
    listEl.querySelectorAll('[data-item-idx]').forEach(row => {
      row.onclick = () => {
        const i = parseInt(row.dataset.itemIdx, 10);
        if (selected.has(i)) selected.delete(i);
        else selected.add(i);
        listEl.innerHTML = renderRows();
        bindRows();
        updateConfirmCount();
      };
    });
  };
  bindRows();
  updateConfirmCount();

  document.getElementById('copy-all').onclick = () => {
    items.forEach((_, i) => selected.add(i));
    listEl.innerHTML = renderRows();
    bindRows();
    updateConfirmCount();
  };
  document.getElementById('copy-none').onclick = () => {
    selected.clear();
    listEl.innerHTML = renderRows();
    bindRows();
    updateConfirmCount();
  };
  document.getElementById('copy-back').onclick = () => openCopyMealSheet(meal);
  document.getElementById('copy-confirm-btn').onclick = async () => {
    if (selected.size === 0) return;
    const pickedItems = items.filter((_, i) => selected.has(i));
    const n = await copyMealItemsFromDate(meal, pickedItems, mode);
    closeSheet();
    toast(`${n} aliment${n === 1 ? 'o copiato' : 'i copiati'}`);
    render();
  };
}

async function copyMealItemsFromDate(meal, items, mode) {
  // Carica diary del giorno corrente
  await loadDiary(state.date);
  if (mode === 'replace') {
    state.diary[meal] = [];
  }
  // Aggiungi gli items selezionati con nuovi ID per evitare collisioni
  for (const it of items) {
    state.diary[meal].push({
      ...it,
      id: uid(),
    });
  }
  await saveDiary();
  return items.length;
}
/* ─── CUSTOM PICKER (for add-custom-to-meal) ─────────── */
function openCustomPicker(meal) {
  if (state.customFoods.length === 0) {
    toast('Nessun alimento salvato — creane uno dal profilo');

  }
  const renderResults = (filter) => {

      ? state.customFoods.filter(f => stripAccents(((f.name || '') + ' ' + (f.brand || '') + ' ' + (f.notes || '')).toLowerCase()).includes(fLow))

    if (filtered.length === 0) {
      return `<div class="subtle-list-empty">Nessun risultato</div>`;

      const kcalSuffix = f.unitName ? `kcal/${f.unitName}` : 'kcal/100g';
      return `

          <div class="result-img-placeholder">${I.leaf}</div>

            <div class="result-name">${esc(f.name)}<span class="result-tag">Mio</span></div>
            <div class="result-meta">${esc(f.brand || 'Senza marca')}</div>
          </div>

  const html = `

    <div class="search-input-wrap" style="margin-bottom:12px">
      ${I.search}
