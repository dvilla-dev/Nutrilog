/**
 * Restituisce la lista completa degli alimenti del DB:
 * - Per ogni LOCAL_FOODS[i]: applica override se esiste in storage `dbOverrides:<userId>:<i>`
 * - Aggiunge gli alimenti aggiunti dall'utente da `dbAdditions:<userId>:<id>`
 * Restituisce array con shape: { ...food, _kind: 'builtin'|'added', _index?: number, _addId?: string, _modified?: boolean }
 */
async function getLocalFoods() {
  if (!state.user || !state.user.userId) {
    return LOCAL_FOODS.map((f, i) => ({ ...f, _kind: 'builtin', _index: i, _modified: false, _hidden: false }));
  }
  const userId = state.user.userId;
  // Override: chiave per ogni alimento builtin modificato
  const ovKeys = await sl(`dbOverrides:${userId}:`);
  const overrides = {};
  for (const k of ovKeys) {
    const idx = parseInt(k.split(':').pop(), 10);
    if (!isNaN(idx)) {
      const o = await sg(k);
      if (o) overrides[idx] = o;
    }
  }
  // Hidden: alimenti CREA-INRAN nascosti dall'utente
  const hiddenKeys = await sl(`dbHidden:${userId}:`);
  const hiddenSet = new Set();
  for (const k of hiddenKeys) {
    const idx = parseInt(k.split(':').pop(), 10);
    if (!isNaN(idx)) hiddenSet.add(idx);
  }
  // Builtin con override applicati
  const result = LOCAL_FOODS.map((f, i) => {
    const o = overrides[i];
    const base = o ? { ...f, ...o, _modified: true } : { ...f, _modified: false };
    return { ...base, _kind: 'builtin', _index: i, _hidden: hiddenSet.has(i) };
  }).filter(f => !f._hidden); // filtra i nascosti per default (li mostriamo solo on-demand)
  // Additions: alimenti completamente nuovi aggiunti dall'utente
  const addKeys = await sl(`dbAdditions:${userId}:`);
  for (const k of addKeys) {
    const a = await sg(k);
    if (a) {
      result.push({ ...a, _kind: 'added', _addId: k.split(':').pop() });
    }
  }
  return result;
}

// Restituisce tutti gli alimenti incluso i nascosti (per la gestione)
async function getAllDbFoods() {
  if (!state.user || !state.user.userId) {
    return LOCAL_FOODS.map((f, i) => ({ ...f, _kind: 'builtin', _index: i, _modified: false, _hidden: false }));
  }
  const userId = state.user.userId;
  const ovKeys = await sl(`dbOverrides:${userId}:`);
  const overrides = {};
  for (const k of ovKeys) {
    const idx = parseInt(k.split(':').pop(), 10);
    if (!isNaN(idx)) {
      const o = await sg(k);
      if (o) overrides[idx] = o;
    }
  }
  const hiddenKeys = await sl(`dbHidden:${userId}:`);
  const hiddenSet = new Set();
  for (const k of hiddenKeys) {
    const idx = parseInt(k.split(':').pop(), 10);
    if (!isNaN(idx)) hiddenSet.add(idx);
  }
  const result = LOCAL_FOODS.map((f, i) => {
    const o = overrides[i];
    const base = o ? { ...f, ...o, _modified: true } : { ...f, _modified: false };
    return { ...base, _kind: 'builtin', _index: i, _hidden: hiddenSet.has(i) };
  });
  const addKeys = await sl(`dbAdditions:${userId}:`);
  for (const k of addKeys) {
    const a = await sg(k);
    if (a) {
      result.push({ ...a, _kind: 'added', _addId: k.split(':').pop(), _hidden: false });
    }
  }
  return result;
}

/* Versione sincrona usata in hot path (search): legge cache già caricata in state.dbFoods */
function getLocalFoodsSync() {
  return state.dbFoods || LOCAL_FOODS.map((f, i) => ({ ...f, _kind: 'builtin', _index: i, _modified: false }));
}

async function refreshDbFoodsCache() {
  state.dbFoods = await getLocalFoods();

function searchLocal(q) {
  const qLow = stripAccents(q.trim().toLowerCase());
  if (!qLow) return [];
  const tokens = qLow.split(/\s+/).filter(Boolean);
  const list = getLocalFoodsSync();
  const scored = [];
  for (let i = 0; i < list.length; i++) {
    const f = list[i];
    const hay = stripAccents((f.name + ' ' + (f.brand || '')).toLowerCase());
    let match = true;
    let score = 0;
    for (const t of tokens) {
      const idx = hay.indexOf(t);
      if (idx === -1) { match = false; break; }
      score += (idx === 0 ? 10 : 1) + (hay.startsWith(t) ? 5 : 0);
    }
    if (match) {
      const id = f._kind === 'added' ? 'add-' + f._addId : 'loc-' + f._index;
      scored.push({
        food: { ...f, id, code: '', image_url: '' },
        score
      });
    }
  }
  scored.sort((a, b) => b.score - a.score);
  return scored.slice(0, 20).map(x => x.food);
}

function searchCustomFoods(q) {
  const qLow = stripAccents(q.trim().toLowerCase());
  if (!qLow) return [];
  const tokens = qLow.split(/\s+/).filter(Boolean);
  const list = state.customFoods || [];
  const scored = [];
  for (const f of list) {
    const hay = stripAccents(((f.name || '') + ' ' + (f.brand || '')).toLowerCase());
    let match = true, score = 0;
    for (const t of tokens) {
      const idx = hay.indexOf(t);
      if (idx === -1) { match = false; break; }
      score += (idx === 0 ? 10 : 1);
    }
    if (match) scored.push({ food: { ...f, _custom: true }, score });
  }
  scored.sort((a, b) => b.score - a.score);
  return scored.map(s => s.food);
}

/* ─── MOST USED FOODS ─────────────────────────────────────
   Calcola gli alimenti più usati dal diario di tutti i giorni
   disponibili. Aggrega per nome+marca. Ritorna i top N.
   ──────────────────────────────────────────────────────── */
async function getMostUsedFoods(limit = 8) {
  if (!state.user || !state.user.userId) return [];
  const userId = state.user.userId;
  const diaryKeys = await sl(`diary:${userId}:`);
  // Conta uso di ogni alimento per nome+marca
  const counts = new Map(); // key -> { food, count }
  for (const k of diaryKeys) {
    const day = await sg(k);
    if (!day) continue;
    for (const meal of ['breakfast','lunch','dinner','snack']) {
      const items = day[meal] || [];
      for (const it of items) {
        const key = ((it.name || '') + '|' + (it.brand || '')).toLowerCase().trim();
        if (!key || key === '|') continue;
        const cur = counts.get(key);
        if (cur) {
          cur.count++;
        } else {
          // Salva una copia "pulita" dell'alimento (senza id specifico, senza grams)
          counts.set(key, {
            count: 1,
            food: {
              id: it.foodId || ('mu-' + uid()),
              name: it.name,
              brand: it.brand || '',
              kcal: it.kcal || 0,
              protein: it.protein || 0,
              carbs: it.carbs || 0,
              fat: it.fat || 0,
              fiber: it.fiber || 0,
              sugar: it.sugar || 0,
              sodium: it.sodium || 0,
              image_url: '',
            },
          });
        }
      }
    }
  }
  // Sort per count desc e ritorna top N
  return Array.from(counts.values())
    .sort((a, b) => b.count - a.count)
    .slice(0, limit)
    .map(x => ({ ...x.food, _usageCount: x.count }));
}

function searchTemplates(q) {
  const qLow = stripAccents(q.trim().toLowerCase());
  if (!qLow) return [];
  const tokens = qLow.split(/\s+/).filter(Boolean);
  const list = state.templates || [];
  const scored = [];
  for (const t of list) {
    const itemNames = (t.items || []).map(it => it.name).join(' ');
    const hay = stripAccents(((t.name || '') + ' ' + itemNames).toLowerCase());
    let match = true, score = 0;
    for (const tok of tokens) {
      const idx = hay.indexOf(tok);
      if (idx === -1) { match = false; break; }
      score += (idx === 0 ? 10 : 1);
    }
    if (match) scored.push({ tpl: t, score });
  }
  scored.sort((a, b) => b.score - a.score);
  return scored.map(s => s.tpl);
}

async function searchOFF(q) {
  // Priorità: database locale (sempre disponibile, istantaneo).
  // Se pochi risultati, prova AI in background (potrebbe fallire per CORS in alcuni ambienti).
  const local = searchLocal(q);
  if (local.length >= 5) return local;

  try {
    const ai = await aiSearchFoods(q);
    const seen = new Set(local.map(f => stripAccents(f.name.toLowerCase())));
    const extras = ai.filter(f => !seen.has(stripAccents(f.name.toLowerCase())));
    return [...local, ...extras];
  } catch (_) {
    // AI non disponibile in questo ambiente: ritorna solo i match locali
    return local;
  }
}

/* ─── AI SEARCH FOOD SPECIFIC ─────────────────────────
   Ricerca diretta di un singolo prodotto specifico (commerciale o
   generico) con focus sui valori nutrizionali ufficiali.
   Diversa da aiSearchFoods (che ritorna varianti/alternative):
   qui ci concentriamo sull'esatto prodotto richiesto.
   ──────────────────────────────────────────────────────── */
async function aiSearchFoodSpecific(query) {
  const cfg = getAiConfig();
  if (!cfg || !cfg.apiKey) {
    throw new Error('AI non configurata (Profilo → AI Vision)');
  }

  const prompt = `Sei un esperto nutrizionale con accesso ai valori nutrizionali ufficiali di prodotti commerciali e alimentari noti a livello globale.

L'utente sta cercando informazioni nutrizionali per: "${query}"

Rispondi SOLO con JSON valido (no markdown, no backtick, no commenti, no testo introduttivo).
Formato esatto:
{"items":[{"name":"string","brand":"string","kcal":0,"protein":0,"carbs":0,"fat":0,"fiber":0,"sugar":0,"sodium":0}]}

Regole:
- Tutti i valori nutrizionali sono per 100g di prodotto.
- "sodium" è in MILLIGRAMMI (mg), non grammi.
- Per prodotti commerciali (Kinder Bueno, Nutella, Pringles, Coca-Cola, M&M's, Snickers, ecc.) usa i valori UFFICIALI dichiarati dal produttore sull'etichetta.
- "brand" deve contenere la marca esatta del prodotto (es. "Ferrero" per Kinder, "Mondelez" per Oreo).
- Per prodotti specifici dai 1-3 risultati esatti (varianti se esistono, es. "Kinder Bueno classico", "Kinder Bueno White").
- Per query generiche (es. "biscotti") dai 5-7 risultati con prodotti commerciali noti.
- Nomi in italiano se possibile, mantenendo il nome originale del brand.
- Se un valore nutrizionale non è disponibile o è zero, usa 0.
- Se il prodotto non esiste, restituisci items vuoto: {"items":[]}.

Prodotto richiesto: ${query}`;

  const MODELS = ['gemini-2.5-flash-lite', 'gemini-2.5-flash', 'gemini-flash-latest'];
  const body = {
    contents: [{ role: 'user', parts: [{ text: prompt }] }],
    generationConfig: {
      response_mime_type: 'application/json',
      temperature: 0.1,
      max_output_tokens: 1024,
    },
  };

  let lastErr = null;
  for (const model of MODELS) {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(cfg.apiKey)}`;
    let res;
    try {
      res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
    } catch (e) {
      lastErr = new Error('Rete: ' + (e.message || 'fetch failed'));
      continue;
    }
    if (!res.ok) {
      if (res.status === 404) { lastErr = new Error(`Modello ${model} non disponibile`); continue; }
      let detail = '';
      try { detail = (await res.text()).slice(0, 200); } catch (_) {}
      throw new Error(`AI HTTP ${res.status} ${res.statusText} ${detail}`);
    }

    const data = await res.json();
    const candidates = data.candidates || [];
    if (!candidates.length) { lastErr = new Error('AI nessuna risposta'); continue; }
    const parts = (candidates[0].content && candidates[0].content.parts) || [];
    const raw = parts.map(p => p.text || '').join('').trim();
    if (!raw) { lastErr = new Error('AI risposta vuota'); continue; }

    const match = raw.match(/\{[\s\S]*\}/);
    if (!match) { lastErr = new Error('AI non ha restituito JSON'); continue; }

    let parsed;
    try { parsed = JSON.parse(match[0]); }
    catch (e) { lastErr = new Error('JSON malformato: ' + e.message); continue; }

    const items = Array.isArray(parsed.items) ? parsed.items : [];
    return items
      .filter(it => it && typeof it.name === 'string' && it.name.trim())
      .map(it => ({
        id: 'ai-' + uid(),
        name: String(it.name).trim(),
        brand: String(it.brand || '').trim(),
        kcal: num(it.kcal),
        protein: num(it.protein),
        carbs: num(it.carbs),
        fat: num(it.fat),
        fiber: num(it.fiber),
        sugar: num(it.sugar),
        sodium: num(it.sodium),
        image_url: '',
      }));
  }
  throw lastErr || new Error('AI non disponibile');
}

/* ─── BOOT ───────────────────────────────────────────────── */
async function boot() {
  render();
  await detectStorage();
  const session = await sg('session');
  if (session && session.userId) {
    state.user = session;
    // Sospendi auto-sync finché non abbiamo caricato TUTTI i dati locali.
    // Senza questo, un saveDiary che parte mentre customFoods è ancora []
    // causerebbe un push al cloud con dati incompleti.
    state._suspendAutoSync = true;
    if (session.authMode === 'github') {
      // Avatar: lookup non bloccante - se è in cache mostralo, altrimenti
      // l'app si carica subito senza aspettare lo storage
      sg('users:gh:' + (session.githubLogin || '').toLowerCase()).then(profile => {
        if (profile && profile.avatar_url) {
          state.user.avatar_url = profile.avatar_url;
          if (state.tab === 'profile') render();
        }
      }).catch(() => {});
    }
    // Carica TUTTI i dati locali PRIMA di mostrare la dashboard e abilitare il sync.
    // Questo previene race condition dove un push partirebbe con dati incompleti.
    await Promise.all([
      loadDiary(state.date),
      loadGoals(),
      loadCustomFoods(),
      loadTemplates(),
      refreshDbFoodsCache(),
    ]);
    state.screen = 'app';
    render();
    // Ora è sicuro riabilitare il sync
    state._suspendAutoSync = false;
  } else {
    state.screen = 'login';
    render();
    return;
  }
  if (state.user && state.user.userId) {
    setTimeout(() => {
      pruneOldDiaryEntries().catch(e => dlog('PRUNE auto FAIL: ' + e.message));
    }, 3000);
    // Pulisci immagini base64 una volta per liberare spazio (eseguito una sola volta dopo update)
    setTimeout(() => {
      pruneBase64Images().then(r => {
        if (r.cleaned > 0) toast(`Pulite ${r.cleaned} foto vecchie (~${(r.bytesFreed/1024).toFixed(0)}KB)`);
      }).catch(e => dlog('PRUNE BASE64 FAIL: ' + e.message));
    }, 5000);
    setTimeout(() => {
      cloudPullAuto().catch(e => dlog('AUTO-PULL outer FAIL: ' + e.message));
    }, 1000);
    // Snapshot automatico al boot (max 1 ogni 30 min, mantiene gli ultimi 5)
    setTimeout(() => {
      saveSnapshot().catch(e => dlog('SNAPSHOT boot FAIL: ' + e.message));
    }, 8000);
  }
}

/* ─── CLOUD AUTO-PULL ALL'AVVIO ─────────────────────────
   Strategy:
   - All'apertura dell'app, dopo aver caricato i dati locali,
     facciamo un pull silenzioso dal cloud
   - Confronta savedAt del cloud con lastSync locale
   - Se cloud più recente → sostituisci i dati locali con quelli
     del cloud (cloud vince), poi ricarica l'UI
   - Tutto silenzioso: nessuna conferma, nessun toast invadente,
     solo log diagnostica e mini-toast neutro alla fine se ha aggiornato
   ──────────────────────────────────────────────────────── */
let _cloudAutoPullDone = false;
async function cloudPullAuto() {
  if (_cloudAutoPullDone) return;
  if (!state.user || !state.user.userId) return;
  if (!cloudBackup || !cloudBackup.isConfigured || !cloudBackup.isConfigured()) {
    dlog('AUTO-PULL: skip (cloud non configurato)');
    return;
  }
  if (typeof navigator !== 'undefined' && navigator.onLine === false) {
    dlog('AUTO-PULL: skip (offline)');
    return;
  }
  _cloudAutoPullDone = true;
  // Sospendi auto-sync push mentre stiamo facendo il pull, per evitare
  // che le scritture indotte dal pull triggerino un push immediato che
  // sovrascrive il cloud appena scaricato
  state._suspendAutoSync = true;
  try {
    dlog('AUTO-PULL: scarico backup cloud...');
    const wrapped = await cloudBackup.pull(APP_ID);
    if (!wrapped || !wrapped.payload) {
      dlog('AUTO-PULL: nessun backup remoto');
      return;
    }
    const cloudSavedAt = wrapped.savedAt ? new Date(wrapped.savedAt).getTime() : 0;
    const cfg = cloudBackup.getConfig && cloudBackup.getConfig();
    const localLastSync = (cfg && cfg.lastSync && cfg.lastSync[APP_ID])
      ? new Date(cfg.lastSync[APP_ID]).getTime()
      : 0;

    // Se il cloud non è più recente del nostro ultimo sync, niente da fare
    if (cloudSavedAt && localLastSync && cloudSavedAt <= localLastSync) {
      dlog('AUTO-PULL: locale già aggiornato (cloud savedAt=' + new Date(cloudSavedAt).toISOString() + ')');
      return;
    }

    const data = wrapped.payload;
    if (!data || data.format !== 'nutrilog-backup') {
      dlog('AUTO-PULL: backup formato non valido');
      return;
    }

    // Cloud è più recente: cancella i dati locali dell'utente e
    // importa quelli del cloud (cloud vince). Manteniamo session e config.
    const userId = state.user.userId;
    const prefixes = [
      `diary:${userId}:`,
      `customFoods:${userId}:`,
      `mealTemplates:${userId}:`,
      `dbOverrides:${userId}:`,
      `dbAdditions:${userId}:`,
      `dbHidden:${userId}:`,
    ];
    for (const p of prefixes) {
      const keys = await sl(p);
      for (const k of keys) await sd(k);
    }
    // Goals key è singolo
    await sd(`goals:${userId}`);

    // Importa i dati del cloud in modalità replace (dato che abbiamo cancellato tutto)
    await importUserData(data, { mode: 'replace' });

    // Ricarica tutto in memoria
    await loadAll();

    // Aggiorna lastSync con il timestamp del cloud per non rifare il pull al prossimo boot
    const c2 = cloudBackup.getConfig() || {};
    c2.lastSync = c2.lastSync || {};
    c2.lastSync[APP_ID] = new Date(cloudSavedAt).toISOString();
    cloudBackup.setConfig(c2);

    dlog('AUTO-PULL: dati cloud applicati (cloud savedAt=' + new Date(cloudSavedAt).toISOString() + ')');
    // Discreto feedback all'utente solo se siamo già nell'app
    if (state.screen === 'app') {
      toast('Dati sincronizzati');
      render();
    }
  } catch (e) {
    dlog('AUTO-PULL FAIL: ' + (e.message || e));
  } finally {
    state._suspendAutoSync = false;
  }
}

async function loadAll() {
  await Promise.all([
    loadDiary(state.date),
    loadGoals(),
    loadCustomFoods(),
    loadTemplates(),
    refreshDbFoodsCache(),
  ]);
}

/* ═══════════════════════════════════════════════════════════
   RENDER
   ═══════════════════════════════════════════════════════════ */
function render() {
  const app = document.getElementById('app');
  if (state.screen === 'loading') {
    app.innerHTML = `<div style="flex:1;display:flex;align-items:center;justify-content:center"><div class="spinner"></div></div>`;
    return;
  }
  if (state.screen === 'login')    { app.innerHTML = renderLogin(); bindAuth(); return; }
  if (state.screen === 'register') { app.innerHTML = renderRegister(); bindAuth(); return; }
  // Salva lo scroll attuale nella mappa per-tab (per la tab che stiamo per lasciare)
  const prevScreen = document.getElementById('screen');
  if (prevScreen && _lastRenderedTab) {
    _tabScroll[_lastRenderedTab] = prevScreen.scrollTop;
  }
  // Determina lo scroll target per la tab che stiamo per renderizzare:
  // 1) Se c'è uno scroll salvato prima di aprire un sheet ed è per la stessa tab, usalo
  // 2) Altrimenti usa lo scroll memorizzato per questa tab (visita precedente)
  // 3) Altrimenti 0
  let scrollTarget = 0;
  if (_savedScrollBeforeSheet && _savedScrollBeforeSheet.tab === state.tab) {
    scrollTarget = _savedScrollBeforeSheet.scrollTop;
    _savedScrollBeforeSheet = null;
  } else if (_tabScroll[state.tab] != null) {
    scrollTarget = _tabScroll[state.tab];
  }
  app.innerHTML = renderAppShell();
  bindApp();
  _lastRenderedTab = state.tab;
  if (scrollTarget > 0) {
    const newScreen = document.getElementById('screen');
    if (newScreen) {
      newScreen.scrollTop = scrollTarget;
      // Doppio fix per iOS Safari che a volte non applica subito lo scroll
      requestAnimationFrame(() => {
        if (newScreen.scrollTop !== scrollTarget) newScreen.scrollTop = scrollTarget;
      });
    }
  }
}

function bindAuth() {
  const goReg = document.getElementById('go-register');
  const goLog = document.getElementById('go-login');
  if (goReg) goReg.onclick = () => { state.screen = 'register'; render(); };
  if (goLog) goLog.onclick = () => { state.screen = 'login'; render(); };

  const ghBtn = document.getElementById('login-github');
  if (ghBtn) ghBtn.onclick = () => openGitHubLoginSheet();

  const form = document.getElementById('auth-form');
  if (!form) return;
  const errEl = document.getElementById('err');
  const btn = document.getElementById('submit-btn');
  form.onsubmit = async (e) => {
    e.preventDefault();
    if (errEl) errEl.innerHTML = '';
    btn.disabled = true;
    const originalText = btn.textContent;
    btn.textContent = '...';
    try {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      if (state.screen === 'register') await register(email, password);
      else await login(email, password);
      await loadAll();
      state.screen = 'app';
      state.tab = 'today';
      render();
    } catch (err) {
      if (errEl) errEl.innerHTML = `<div class="auth-error">${esc(err.message)}</div>`;
      btn.disabled = false;
      btn.textContent = originalText;
    }
  };
}

function openGitHubLoginSheet() {
  openSheet(`

    <p class="sheet-sub">Una volta connesso, i tuoi dati saranno disponibili da qualsiasi dispositivo dove inserisci lo stesso token.</p>

    <div style="background:var(--surface-2);border-radius:10px;padding:14px;margin-bottom:14px;font-size:13px;line-height:1.6">

      <ol style="padding-left:20px;margin:0;color:var(--text-2)">
        <li>Vai su <a href="https://github.com/settings/tokens" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:none">github.com/settings/tokens</a></li>
        <li>Genera un <b style="color:var(--text)">Classic token</b></li>
        <li>Scope: solo <b style="color:var(--text)">gist</b></li>
        <li>Scadenza: <b style="color:var(--text)">No expiration</b> (consigliato)</li>
        <li>Copia e incolla qui sotto</li>
      </ol>
    </div>

    <form id="gh-login-form">
      <div class="field">
        <label>Personal Access Token</label>
        <input class="input" id="gh-token" type="password" placeholder="ghp_... o github_pat_..." autocomplete="off" required>
      </div>
      <button class="btn btn-primary" type="submit">Accedi</button>
      <button class="btn btn-ghost" type="button" id="gh-cancel" style="margin-top:6px">Annulla</button>
    </form>

    <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border);font-size:12px;color:var(--text-3);line-height:1.5">
      <b style="color:var(--text-2)">Privacy:</b> il token è memorizzato solo su questo dispositivo. I tuoi dati nutrizionali stanno in un gist privato del <i>tuo</i> account GitHub, non su server di terzi.
    </div>
  `);
  document.getElementById('gh-cancel').onclick = closeSheet;
  document.getElementById('gh-login-form').onsubmit = async (e) => {
    e.preventDefault();
    const tk = document.getElementById('gh-token').value.trim();
    if (!tk) return;

    openSheet(`
      <h2 class="sheet-title">Accesso in corso...</h2>
      <p class="sheet-sub">Verifica del token e recupero dei dati dal cloud.</p>
      <div class="spinner"></div>
    `);
    try {
      await loginWithGitHub(tk);
      await loadAll();
      state.screen = 'app';
      state.tab = 'today';
      closeSheet();
      toast('Bentornato @' + state.user.githubLogin);
      render();
    } catch (err) {
      const recentLogs = _debugLog.slice(-8).reverse();
      openSheet(`
        <h2 class="sheet-title" style="color:var(--danger)">Accesso fallito</h2>
        <p class="sheet-sub">${esc(err.message || String(err))}</p>

        <details open style="margin-bottom:14px">
          <summary style="cursor:pointer;font-size:11px;color:var(--text-3);letter-spacing:0.1em;text-transform:uppercase;font-weight:600;padding:10px 0">Diagnostica</summary>
          <div style="background:var(--surface-2);border-radius:10px;padding:10px;font-family:ui-monospace,monospace;font-size:10.5px;color:var(--text-2);max-height:220px;overflow-y:auto">
            ${recentLogs.length === 0 ? '<i style="color:var(--text-3)">Nessun log</i>' : recentLogs.map(l => `<div style="padding:2px 0;word-break:break-all">${esc(l)}</div>`).join('')}
          </div>
        </details>

        <button class="btn btn-primary" id="gh-retry">Riprova</button>
        <button class="btn btn-secondary" id="gh-copy-log" style="margin-top:8px">Copia diagnostica</button>
        <button class="btn btn-ghost" id="gh-close" style="margin-top:6px">Chiudi</button>
      `);
      document.getElementById('gh-retry').onclick = openGitHubLoginSheet;
      document.getElementById('gh-close').onclick = closeSheet;
      document.getElementById('gh-copy-log').onclick = async () => {
        const txt = recentLogs.join('\n');
        try {
          await navigator.clipboard.writeText('NutriLog error: ' + (err.message || '') + '\n\n' + txt);
          toast('Diagnostica copiata');
        } catch (_) {
          toast('Copia non disponibile su questo browser');
        }
      };
    }
  };
}

function renderAppShell() {
  let content = '';
  let header = '';
  let tabbar = renderTabbar();
  if (state.tab === 'today')   { header = renderHeader('Diario'); content = renderToday(); }
  if (state.tab === 'search')  {
    const hasBack = !!state.searchOriginTab;
    header = renderHeader('Cerca alimenti', hasBack);
    content = renderSearch();
  }
  if (state.tab === 'photo')   { header = renderHeader('Foto AI'); content = renderPhotoTab(); }
  if (state.tab === 'profile') { header = renderHeader('Profilo'); content = renderProfile(); }
  return `${header}<div class="screen" id="screen">${content}</div>${tabbar}`;
}
function renderHeader(title, withBack = false) {
  if (withBack) {
    return `<div class="header header-with-back">
      <button class="header-back-btn" id="header-back">${I.left}<span>Indietro</span></button>
      <h1>${esc(title)}</h1>
    </div>`;
  }
  return `<div class="header"><h1>${esc(title)}</h1></div>`;
}
function renderTabbar() {
  const tab = (id, label, icon, sublabel) => `
    <button class="tab ${state.tab === id ? 'active' : ''}" data-tab="${id}">
      ${icon}<span>${label}${sublabel ? `<small style="display:block;font-size:9px;opacity:0.7;margin-top:1px;letter-spacing:0">${sublabel}</small>` : ''}</span>
    </button>`;
  // Per il tab "Oggi": se state.date è oggi → label "Oggi". Altrimenti label
  // è il giorno selezionato (es. "1 MAG") con piccolo accento indicatore.
  const today = todayISO();
  const onToday = state.date === today;
  const todayLabel = onToday ? 'Oggi' : (() => {
    const months = ['GEN','FEB','MAR','APR','MAG','GIU','LUG','AGO','SET','OTT','NOV','DIC'];
    const d = parseInt(state.date.slice(8,10), 10);
    const m = months[parseInt(state.date.slice(5,7), 10) - 1];
    return `${d} ${m}`;
  })();
  return `<div class="tabbar">
    ${tab('today', todayLabel, I.home, !onToday ? '• torna a oggi' : null)}
    ${tab('search', 'Cerca', I.search)}
    ${tab('photo', 'Foto', I.camera)}
    ${tab('profile', 'Profilo', I.user)}
  </div>`;
}

/* ─── TODAY (Dashboard + Diary) ──────────────────────────── */
/* ─── DASHBOARD CONFIG ────────────────────────────────────
   Gestisce visibilità e altezza delle card della dashboard.
   Stato persistito in localStorage per ogni utente.
   ──────────────────────────────────────────────────────── */
const DASH_CFG_KEY = 'nutrilog::dashboard-cfg';
const DASH_DEFAULT = {
  show: { kcal: true, macro: true, micro: false, week: false },
  heights: {}, // es. { kcal: 320, macro: 180 } - opzionale, default = auto
  resizeLocked: true, // di default le maniglie sono BLOCCATE per evitare modifiche accidentali durante lo scroll
};
function getDashboardCfg() {
  try {
    const raw = localStorage.getItem(DASH_CFG_KEY);
    if (!raw) return { ...DASH_DEFAULT, show: { ...DASH_DEFAULT.show }, heights: {} };
    const parsed = JSON.parse(raw);
    return {
      show: { ...DASH_DEFAULT.show, ...(parsed.show || {}) },
      heights: parsed.heights || {},
      resizeLocked: parsed.resizeLocked !== undefined ? parsed.resizeLocked : true,
    };
  } catch (_) {
    return { ...DASH_DEFAULT, show: { ...DASH_DEFAULT.show }, heights: {} };
  }
}
function setDashboardCfg(cfg) {
  try { localStorage.setItem(DASH_CFG_KEY, JSON.stringify(cfg)); } catch (_) {}
}

/* ─── PASTI CUSTOMIZZABILI ────────────────────────────────
   L'utente può aggiungere, rinominare, riordinare, nascondere pasti.
   I 4 default sono: breakfast, lunch, dinner, snack.
   Quelli aggiunti hanno id custom (es. "m-abc123").
   Salvati in localStorage (NON nel cloud per ora — sono preferenze UI).
   ──────────────────────────────────────────────────────── */
const MEALS_CFG_KEY = 'nutrilog::meals-cfg';
const MEALS_DEFAULT = [
  { id: 'breakfast', name: 'Colazione', visible: true },
  { id: 'lunch',     name: 'Pranzo',    visible: true },
  { id: 'dinner',    name: 'Cena',      visible: true },
  { id: 'snack',     name: 'Spuntino',  visible: true },
];
function getMealsCfg() {
  try {
    const raw = localStorage.getItem(MEALS_CFG_KEY);
    if (!raw) return MEALS_DEFAULT.map(m => ({...m}));
    const parsed = JSON.parse(raw);
    if (!Array.isArray(parsed) || parsed.length === 0) return MEALS_DEFAULT.map(m => ({...m}));
    return parsed;
  } catch (_) { return MEALS_DEFAULT.map(m => ({...m})); }
}
function setMealsCfg(meals) {
  try { localStorage.setItem(MEALS_CFG_KEY, JSON.stringify(meals)); } catch (_) {}
}
function visibleMeals() {
  return getMealsCfg().filter(m => m.visible !== false);
}

function renderToday() {
  const t = computeTotals();
  const g = getGoalsForDate(state.date);
  const goalsConfigured = g.calories > 0;
  const pct = goalsConfigured ? clamp(t.kcal / g.calories, 0, 1.2) : 0;
  const R = 84, C = 2 * Math.PI * R;
  const off = C * (1 - Math.min(pct, 1));
  // Sforamento kcal: se positivo l'utente ha ancora calorie, se negativo le ha sforate
  const isOver = goalsConfigured && t.kcal > g.calories;
  const remainingRaw = goalsConfigured ? (g.calories - t.kcal) : 0; // può essere negativo
  const remaining = Math.max(0, remainingRaw); // per le label "rimaste"
  const overAmount = isOver ? Math.round(t.kcal - g.calories) : 0;
  const pDate = prettyDate(state.date);
  const dCfg = getDashboardCfg();

  const bar = (lbl, val, goal, cls) => {
    const p = goal > 0 ? clamp(val / goal, 0, 1) * 100 : 0;
    return `<div class="macro-row">
      <div class="macro-label">${lbl}</div>
      <div class="macro-bar"><div class="macro-fill ${cls}" style="width:${p}%"></div></div>
      <div class="macro-value">${round(val)}<small>/${round(goal)}g</small></div>
    </div>`;
  };
  const micro = (lbl, val, goal, unit) => `
    <div style="text-align:center">
      <div style="font-size:16px;font-weight:600;letter-spacing:-0.02em">${round(val)}<span style="color:var(--text-3);font-weight:400;font-size:12px">/${round(goal)}${unit}</span></div>
      <div style="font-size:10.5px;color:var(--text-2);text-transform:uppercase;letter-spacing:0.1em;margin-top:3px;font-weight:500">${lbl}</div>
    </div>`;

  // Helper per generare una card con maniglia di resize e altezza salvata
  const heightStyle = (cardId) => {
    const h = dCfg.heights[cardId];
    return h ? `style="min-height:${h}px"` : '';
  };
  const resizeHandle = (cardId) => dCfg.resizeLocked ? '' : `<div class="card-resize-handle" data-resize-card="${cardId}" aria-label="Trascina per ridimensionare"><div class="card-resize-grip"></div></div>`;

  return `
    <div class="dash-top">
      <div class="datenav">
        <button data-date="prev" aria-label="Giorno precedente">${I.left}</button>
        <button class="date-label" data-open-calendar aria-label="Apri calendario">${pDate.main}<span>${pDate.sub}</span></button>
        <button data-date="next" aria-label="Giorno successivo">${I.right}</button>
      </div>
      <button class="dash-cfg-btn" data-open-dash-cfg aria-label="Personalizza dashboard">${I.settings || I.edit}</button>
    </div>

    ${dCfg.show.kcal ? `
      <div class="card card-resizable ${isOver ? 'kcal-over' : ''}" data-card-id="kcal" ${heightStyle('kcal')}>
        <div class="ring-wrap">
          <svg width="200" height="200" viewBox="0 0 200 200">
            <circle class="ring-bg" cx="100" cy="100" r="${R}" fill="none" stroke-width="14"/>
            <circle class="ring-fg" cx="100" cy="100" r="${R}" fill="none" stroke-width="14"
              stroke-linecap="round"
              stroke-dasharray="${C}"
              stroke-dashoffset="${off}"/>
          </svg>
          <div class="ring-center">
            <div class="ring-value">${round(t.kcal)}</div>
            <div class="ring-label">${isOver
              ? `<span class="ring-over">−${overAmount} kcal sforate</span>`
              : `${round(remaining)} kcal rimaste`}</div>
          </div>
        </div>
        <div class="ring-sub">
          <div><div class="n">${round(t.kcal)}</div><div class="l">Assunte</div></div>
          <div><div class="n">${round(g.calories)}</div><div class="l">Obiettivo</div></div>
          <div><div class="n ${isOver ? 'over' : ''}">${isOver ? '−' + overAmount : round(remaining)}</div><div class="l">${isOver ? 'Sforate' : 'Rimaste'}</div></div>
        </div>
        ${resizeHandle('kcal')}
      </div>
    ` : ''}

    ${dCfg.show.macro ? `
      <h3 class="section-title">Macronutrienti</h3>
      <div class="card card-resizable" data-card-id="macro" ${heightStyle('macro')}>
        ${bar('Proteine', t.protein, g.protein, 'protein')}
        ${bar('Carboidrati', t.carbs, g.carbs, 'carbs')}
        ${bar('Grassi', t.fat, g.fat, 'fat')}
        ${resizeHandle('macro')}
      </div>
    ` : ''}

    ${dCfg.show.micro ? `
      <h3 class="section-title">Micronutrienti</h3>
      <div class="card card-resizable" data-card-id="micro" ${heightStyle('micro')} style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px;position:relative">
        ${micro('Fibre', t.fiber, g.fiber, 'g')}
        ${micro('Zuccheri', t.sugar, g.sugar, 'g')}
        ${micro('Saturi', t.sodium, g.sodium, 'g')}
        ${resizeHandle('micro')}
      </div>
    ` : ''}

    ${dCfg.show.week ? `
      <h3 class="section-title">Settimana</h3>
      <div id="week-summary-card" class="card card-resizable" data-card-id="week" ${heightStyle('week')} style="padding:18px 18px 16px;position:relative">
        <div style="font-size:13px;color:var(--text-2)">Calcolo riepilogo...</div>
        ${resizeHandle('week')}
      </div>
    ` : ''}

    <h3 class="section-title">Pasti</h3>
    ${visibleMeals().map(m => renderMeal(m.id, m.name)).join('')}

    <button class="fab" id="fab-add" aria-label="Aggiungi rapidamente">${I.plus}</button>
  `;
}
function renderMeal(key, title) {
  const items = state.diary[key] || [];
  const m = mealMacros(key);
  const hasFood = items.length > 0;
  const inSelMode = state.selectionMode && state.selectionMode.meal === key;
  const selectedIds = inSelMode ? state.selectionMode.selected : null;
  const selCount = inSelMode ? selectedIds.size : 0;

  return `<div class="meal" data-meal="${key}">
    <div class="meal-head">
      <div class="meal-title"><span class="dot"></span>${esc(title)}</div>
      <div style="display:flex;align-items:center;gap:8px">
        ${inSelMode ? `
          <button class="meal-sel-cancel" data-sel-cancel="${key}" aria-label="Annulla selezione">Annulla</button>
          <button class="meal-sel-delete" data-sel-delete="${key}" aria-label="Elimina selezionati" ${selCount === 0 ? 'disabled' : ''}>${I.trash} ${selCount > 0 ? selCount : ''}</button>
        ` : `
          <div class="meal-kcal-wrap">
            <div class="meal-kcal">${round(m.kcal)} kcal</div>
            ${hasFood ? `<div class="meal-macros"><span style="color:var(--protein)">P ${round(m.protein, 1)}g</span> · <span style="color:var(--carbs)">C ${round(m.carbs, 1)}g</span> · <span style="color:var(--fat)">G ${round(m.fat, 1)}g</span></div>` : ''}
          </div>
          ${hasFood ? `<button class="meal-sel-btn" data-sel-start="${key}" aria-label="Seleziona alimenti">${I.check}</button>` : ''}
          <button class="meal-copy-btn" data-copy-meal="${key}" aria-label="Copia da giorno precedente" title="Copia da un altro giorno">${I.copy}</button>
        `}
      </div>
    </div>
    <div class="meal-list">
      ${items.length === 0
        ? `<div class="meal-empty">Nessun alimento</div>`
        : items.map(it => {
            const isSel = selectedIds && selectedIds.has(it.id);
            // Se l'alimento ha un'unità (es. "uovo"), mostra "1 uovo" invece di "100g"
            const quantityLabel = it.unitName
              ? `${round(it.grams / 100, 1)} ${esc(it.unitName)}${it.grams / 100 !== 1 ? '' : ''}`
              : `${round(it.grams)}g`;
            return `
              <div class="food-item ${inSelMode ? 'sel-mode' : ''} ${isSel ? 'sel' : ''}" ${inSelMode ? `data-sel-toggle="${key}:${it.id}"` : `data-edit="${key}:${it.id}"`}>
                ${inSelMode ? `<div class="food-checkbox">${isSel ? I.check : ''}</div>` : ''}
                <div class="food-main">
                  <div class="food-name">${esc(it.name)}</div>
                  <div class="food-meta">${esc(it.brand ? it.brand + ' · ' : '')}${quantityLabel} · ${round(it.kcal * it.grams / 100)} kcal</div>
                </div>
                ${!inSelMode ? `<button class="food-del" data-del="${key}:${it.id}" aria-label="Rimuovi">${I.trash}</button>` : ''}
              </div>`;
          }).join('')}
    </div>
    ${!inSelMode ? `<div class="meal-add">
      <button data-add-quick="${key}">${I.bolt}<span>Rapido</span></button>
      <button data-add-search="${key}">${I.search}<span>Cerca</span></button>
      <button data-add-template="${key}">${I.stack}<span>Pasti</span></button>
      <button data-add-custom="${key}">${I.box}<span>I miei</span></button>
    </div>` : ''}
  </div>`;
}

/* ─── SEARCH ─────────────────────────────────────────────── */
function renderSearch() {
  let content = '';
  if (state.searchState === 'loading') content = `<div class="spinner"></div>`;
  else if (state.searchState === 'error') content = `<div class="state">${I.search}
      <div style="color:var(--danger);margin-bottom:8px;font-weight:500">Errore nella ricerca</div>
      <div style="font-size:12px;color:var(--text-3);word-break:break-word;padding:0 20px;line-height:1.5">${esc(state.searchError || 'Errore sconosciuto')}</div>

  else if (state.searchResults.length || (state.searchTemplateResults && state.searchTemplateResults.length)) {

    // Sezione: Alimenti
    if (state.searchResults.length) {

      if (hasTpls) parts.push(`<div style="font-size:11px;font-weight:600;color:var(--text-3);letter-spacing:0.1em;text-transform:uppercase;padding:14px 4px 8px">Alimenti</div>`);

            ? `Sto cercando: <strong>${esc(state.searchQuery)}</strong>`

// Contatore di richieste per evitare che una vecchia ricerca AI sovrascriva una nuova
let _searchGen = 0;
const doSearch = debounce(async (q) => {
  if (!q || q.length < 2) {
    state.searchState = 'idle';
    state.searchResults = [];
    state.searchTemplateResults = [];
    state.searchQuery = q;
    state.searchError = '';
    updateSearchResults();
    return;
  }
  state.searchQuery = q;
  const myGen = ++_searchGen;
  state.searchError = '';

  // ── FASE 1 — Mostra subito i risultati locali (sincroni, istantanei)
  const customMatches = searchCustomFoods(q);
  const tplMatches = searchTemplates(q);
  const localDb = searchLocal(q);

  const customKeys = new Set(customMatches.map(c => stripAccents((c.name || '').toLowerCase())));
  const dbFiltered = localDb.filter(f => !customKeys.has(stripAccents((f.name || '').toLowerCase())));
  const phase1 = [...customMatches, ...dbFiltered];

  if (phase1.length === 0 && tplMatches.length === 0) {
    // Nessun risultato locale: mostra loading mentre cerchiamo con AI
    state.searchState = 'loading';
    state.searchResults = [];
    state.searchTemplateResults = [];
  } else {
    // Mostriamo subito i risultati locali
    state.searchState = 'results';
    state.searchResults = phase1;
    state.searchTemplateResults = tplMatches;
  }
  updateSearchResults();

  // ── FASE 2 — Prova AI fallback in background SOLO se servono più risultati
  // (meno di 5 risultati DB locali). Se la ricerca corrente cambia nel
  // frattempo, scarta i risultati AI.
  if (localDb.length < 5) {
    try {
      const ai = await aiSearchFoods(q);
      if (myGen !== _searchGen) return; // query cambiata, scarta
      const seen = new Set(phase1.map(f => stripAccents((f.name || '').toLowerCase())));
      const extras = ai.filter(f => !seen.has(stripAccents((f.name || '').toLowerCase())));
      if (extras.length > 0) {
        state.searchResults = [...phase1, ...extras];
        state.searchState = 'results';
        updateSearchResults();
      } else if (phase1.length === 0 && tplMatches.length === 0) {
        // Nessun risultato anche da AI
        state.searchState = 'empty';
        updateSearchResults();
      }
    } catch (e) {
      if (myGen !== _searchGen) return;
      // AI fallita: se non c'erano risultati locali, mostra empty
      if (phase1.length === 0 && tplMatches.length === 0) {
        state.searchState = 'empty';
        updateSearchResults();
      }
      dlog('AI fallback failed: ' + ((e && e.message) ? e.message : String(e)));
    }
  }
}, 150);

function updateSearchResults() {
  const el = document.getElementById('search-results');
  if (!el) return;
  const tmp = document.createElement('div');
  tmp.innerHTML = renderSearch();
  const next = tmp.querySelector('#search-results');
  el.innerHTML = next.innerHTML;
  bindSearchResults();
}

/* ═══════════════════════════════════════════════════════════
   SHEETS (modals)
   ═══════════════════════════════════════════════════════════ */
let _sheetGen = 0;  // Incrementato ad ogni openSheet/closeSheet, usato dai debounce per evitare leak

let _savedScrollBeforeSheet = null;
// Memoria scroll per tab: quando lasciamo una tab, salviamo dov'eravamo.
// Quando ci torniamo dopo aver fatto un'azione (es. aggiungere da Cerca),
// l'utente si ritrova nella stessa posizione.
const _tabScroll = Object.create(null);
function openSheet(html) {
  // Salva la scroll position dello screen principale PRIMA di aprire lo sheet,
  // così possiamo ripristinarla dopo che lo sheet si chiude e render() si esegue
  const scr = document.getElementById('screen');
  if (scr && _savedScrollBeforeSheet === null) {
    _savedScrollBeforeSheet = { tab: state.tab, scrollTop: scr.scrollTop };
  }
  _sheetGen++;
  const portal = document.getElementById('portal');
  portal.innerHTML = `<div class="sheet-backdrop" id="backdrop"><div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <button class="sheet-close" id="sheet-close" aria-label="Chiudi">${I.left}<span>Indietro</span></button>
    ${html}
  </div></div>`;
  const backdrop = document.getElementById('backdrop');
  const sheet = document.getElementById('sheet');
  backdrop.onclick = (e) => { if (e.target === backdrop) closeSheet(); };
  sheet.onclick = (e) => e.stopPropagation();
  document.getElementById('sheet-close').onclick = () => closeSheet();

  // Swipe-down per chiudere (gesto naturale iOS)
  // Si attiva solo quando si trascina dall'alto del foglio
  let touchStartY = 0;
  let touchCurrentY = 0;
  let dragging = false;
  const handle = sheet.querySelector('.sheet-handle');
  const closeBtn = document.getElementById('sheet-close');
  const dragArea = [handle, closeBtn].filter(Boolean);
  dragArea.forEach(el => {
    el.addEventListener('touchstart', (e) => {
      if (e.touches.length !== 1) return;
      touchStartY = e.touches[0].clientY;
      touchCurrentY = touchStartY;
      dragging = true;
      sheet.style.transition = 'none';
    }, { passive: true });
  });
  sheet.addEventListener('touchmove', (e) => {
    if (!dragging) return;
    touchCurrentY = e.touches[0].clientY;
    const dy = Math.max(0, touchCurrentY - touchStartY);
    if (dy > 0) sheet.style.transform = `translateY(${dy}px)`;
  }, { passive: true });
  sheet.addEventListener('touchend', () => {
    if (!dragging) return;
    dragging = false;
    const dy = touchCurrentY - touchStartY;
    sheet.style.transition = '';
    if (dy > 80) {
      closeSheet();
    } else {
      sheet.style.transform = '';
    }
  });

  // Edge-swipe da sinistra a destra per chiudere (come iOS back).
  // Si attiva solo se il dito parte dai primi 24px dal bordo sinistro,
  // e SOLO dopo che il movimento orizzontale supera nettamente quello verticale.
  let edgeStartX = 0;
  let edgeStartY = 0;
  let edgeCurrentX = 0;
  let edgeCurrentY = 0;
  let edgeDragging = false;
  let edgeActivated = false; // diventa true solo dopo aver confermato che è swipe orizzontale
  sheet.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) return;
    const t = e.touches[0];
    if (t.clientX > 24) return; // solo dal bordo sinistro
    edgeStartX = t.clientX;
    edgeStartY = t.clientY;
    edgeCurrentX = edgeStartX;
    edgeCurrentY = edgeStartY;
    edgeDragging = true;
    edgeActivated = false;
    // NON settiamo transition:none qui — aspettiamo che l'edge swipe sia confermato
  }, { passive: true });
  sheet.addEventListener('touchmove', (e) => {
    if (!edgeDragging) return;
    edgeCurrentX = e.touches[0].clientX;
    edgeCurrentY = e.touches[0].clientY;
    const dx = edgeCurrentX - edgeStartX;
    const dy = Math.abs(edgeCurrentY - edgeStartY);
    if (!edgeActivated) {
      // Aspetta che ci sia chiarezza sulla direzione (>12px in qualche direzione)
      if (Math.abs(dx) < 12 && dy < 12) return;
      if (dy > Math.abs(dx) - 4) {
        // Movimento verticale o ambiguo: abbandona, lascia lo scroll naturale
        edgeDragging = false;
        return;
      }
      edgeActivated = true;
      sheet.style.transition = 'none';
    }
    if (dx > 0) sheet.style.transform = `translateX(${dx}px)`;
  }, { passive: true });
  sheet.addEventListener('touchend', () => {
    if (!edgeDragging) return;
    edgeDragging = false;
    if (!edgeActivated) return;
    edgeActivated = false;
    const dx = edgeCurrentX - edgeStartX;
    sheet.style.transition = '';
    if (dx > 80) {
      closeSheet();
    } else {
      sheet.style.transform = '';
    }
  });
}

  document.getElementById('portal').innerHTML = '';

function bindAddFoodSheet() {
  const gramsEl = document.getElementById('grams');
  const pv = document.getElementById('add-preview');
  const mp = document.getElementById('meal-pick');
  const portionBar = document.getElementById('portion-bar');
  const baseGrams = num(portionBar?.dataset.baseGrams, 100) || 100;
  const f = state.addFood.food;
  const update = () => {
    state.addFood.grams = num(gramsEl.value, 0);
    const g = state.addFood.grams;
    const factor = g / 100;
    // Trova gli elementi figli e aggiorna i valori — riusiamo gli ID per evitare ricostruzione
    const kcalEl = pv.querySelector('span[style*="--accent"]');
    if (kcalEl) kcalEl.textContent = round(f.kcal * factor);
    const prot = document.getElementById('pv-prot');
    const carb = document.getElementById('pv-carb');
    const fat = document.getElementById('pv-fat');
    if (prot) prot.innerHTML = `${round(f.protein * factor, 1)}<span style="font-size:11px;font-weight:500;color:var(--text-3)">g</span>`;
    if (carb) carb.innerHTML = `${round(f.carbs * factor, 1)}<span style="font-size:11px;font-weight:500;color:var(--text-3)">g</span>`;
    if (fat)  fat.innerHTML  = `${round(f.fat * factor, 1)}<span style="font-size:11px;font-weight:500;color:var(--text-3)">g</span>`;
    // Sincronizza i pulsanti porzione: evidenzia quello attivo se i grammi
    // corrispondono esattamente a un multiplo intero della base
    if (portionBar && baseGrams > 0) {
      const ratio = g / baseGrams;
      const isInt = Math.abs(ratio - Math.round(ratio)) < 0.001;
      portionBar.querySelectorAll('[data-portion]').forEach(b => {
        const p = parseInt(b.dataset.portion, 10);
        b.classList.toggle('sel', isInt && p === Math.round(ratio));
      });
    }
  };
  gramsEl.oninput = update;
  update(); // primo render con valore di default 100g

  // Pulsanti porzione (1×, 2×, 3×) e +/-
  if (portionBar) {
    portionBar.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      const op = btn.dataset.portionOp;
      const portion = btn.dataset.portion;
      const cur = num(gramsEl.value, baseGrams);
      let next = cur;
      if (op === 'inc') {
        // Calcola la porzione corrente (arrotondata) e aggiungi 1
        const ratio = cur / baseGrams;
        const nextRatio = Math.floor(ratio + 0.001) + 1;
        next = Math.round(baseGrams * nextRatio);
      } else if (op === 'dec') {
        const ratio = cur / baseGrams;
        // Vai alla porzione intera precedente, ma non scendere sotto 1×
        const nextRatio = Math.max(1, Math.ceil(ratio - 0.001) - 1);
        next = Math.round(baseGrams * nextRatio);
      } else if (portion) {
        next = Math.round(baseGrams * parseInt(portion, 10));
      }
      if (next > 0 && next <= 5000) {
        gramsEl.value = next;
        update();
      }
    });
  }

  mp.addEventListener('click', (e) => {
    const b = e.target.closest('[data-meal-pick]');
    if (!b) return;
    state.addFood.meal = b.dataset.mealPick;
    mp.querySelectorAll('button').forEach(x => x.classList.toggle('sel', x.dataset.mealPick === state.addFood.meal));
  });

  // Gestione input pezzi: se l'alimento è in modalità pezzo, l'input #grams è hidden
  // e contiene "100 * numero_pezzi" (1 pezzo = 100g virtuali per i calcoli con kcal/100g).
  const piecesEl = document.getElementById('pieces');
  const piecesBar = document.getElementById('pieces-bar');
  if (piecesEl) {
    // Aggiornamento valore pezzi → aggiorna #grams (hidden) → trigger update preview
    piecesEl.oninput = () => {
      const pieces = num(piecesEl.value, 0);
      const g = Math.round(pieces * 100); // 1 pezzo = 100g virtuali
      if (g > 0 && g <= 5000) {
        gramsEl.value = g;
        update();
      }
    };
    if (piecesBar) {
      piecesBar.addEventListener('click', (e) => {
        const btn = e.target.closest('button');
        if (!btn) return;
        const op = btn.dataset.piecesOp;
        const pieces = btn.dataset.pieces;
        const cur = num(piecesEl.value, 1);
        let next = cur;
        if (op === 'inc') next = Math.round((cur + 1) * 10) / 10;
        else if (op === 'dec') next = Math.max(0.5, Math.round((cur - 1) * 10) / 10);
        else if (pieces) next = parseFloat(pieces);
        if (next > 0) {
          piecesEl.value = next;
          const g = Math.round(next * 100);
          if (g > 0 && g <= 5000) {
            gramsEl.value = g;
            update();
          }
        }
      });
    }
  }

  document.getElementById('add-confirm').onclick = async () => {
    const g = num(gramsEl.value, 0);
    if (g <= 0) { toast('Inserisci una quantità valida'); return; }
    const meal = state.addFood.meal;
    const returnTo = state.addFood.returnTo;
    await addFoodToDiary(meal, state.addFood.food, g);
    toast('Aggiunto al diario');
    // Se c'è un "ritorno" specifico, riapri quello sheet (resto sullo stesso menu)
    if (returnTo && returnTo.type === 'customPicker') {
      state.addFood = null;
      openCustomPicker(returnTo.meal);
      return;
    }
    if (returnTo && returnTo.type === 'search') {
      state.addFood = null;
      closeSheet();
      // Resta sulla tab search, ripulisce solo il campo
      const q = document.getElementById('q');
      if (q) { q.value = ''; q.focus(); }
      state.searchQuery = '';
      state.searchResults = [];
      state.searchState = 'idle';
      render();
      return;
    }
    if (returnTo && returnTo.type === 'templates') {
      state.addFood = null;
      openTemplatesSheet(returnTo.meal);
      return;
    }
    // Fallback comportamento precedente: chiudi e vai a today
    closeSheet();
    if (state.tab !== 'today') { state.tab = 'today'; }
    render();
  };
  document.getElementById('add-cancel').onclick = closeSheet;
}

      fiber: round(num($('qa-fib').value, 0), 1),
      sugar: round(num($('qa-sug').value, 0), 1),
      sodium: round(num($('qa-sod').value, 0), 0),
      image_url: '',
    };

    if ($('qa-save-custom').checked) {
      const saved = await saveCustomFood({
        name: food.name,
        brand: '',
        kcal: food.kcal,
        protein: food.protein,
        carbs: food.carbs,
        fat: food.fat,
        fiber: food.fiber,
        sugar: food.sugar,
        sodium: food.sodium,
      });
      await loadCustomFoods();
      food.id = saved.id;
    }

    await addFoodToDiary(meal, food, grams);
    closeSheet();
    toast(`"${name}" aggiunto`);
    render();
  };
}

    <details style="margin-bottom:14px">

      <div style="padding-top:4px">

        <div class="row-3">
          <div class="field"><label>Proteine</label><input class="input" type="number" step="0.1" min="0" id="ee-p" value="${entry.protein}"></div>
          <div class="field"><label>Carb</label><input class="input" type="number" step="0.1" min="0" id="ee-c" value="${entry.carbs}"></div>
          <div class="field"><label>Grassi</label><input class="input" type="number" step="0.1" min="0" id="ee-fat" value="${entry.fat}"></div>
        </div>
        <div class="row-3">
          <div class="field"><label>Fibre</label><input class="input" type="number" step="0.1" min="0" id="ee-fib" value="${entry.fiber}"></div>
          <div class="field"><label>Zucch.</label><input class="input" type="number" step="0.1" min="0" id="ee-sug" value="${entry.sugar}"></div>
          <div class="field"><label>Saturi g</label><input class="input" type="number" step="0.1" min="0" id="ee-sod" value="${entry.sodium}"></div>

    <button class="btn btn-danger" id="ee-delete" style="margin-top:8px">${I.trash}<span>Rimuovi dal diario</span></button>
    <button class="btn btn-ghost" id="ee-cancel" style="margin-top:6px">Annulla</button>

  let selectedMeal = meal;
  const $ = (id) => document.getElementById(id);
  const recalc = () => {
    const g = num($('ee-grams').value, 0);
    const k = num($('ee-kcal').value, 0);
    const p = num($('ee-p').value, 0);
    const c = num($('ee-c').value, 0);

    $('ee-t-p').textContent = round(p * g / 100, 1);
    $('ee-t-c').textContent = round(c * g / 100, 1);
    $('ee-t-f').textContent = round(f * g / 100, 1);
  };
  ['ee-grams', 'ee-kcal', 'ee-p', 'ee-c', 'ee-fat'].forEach(id => {
    const el = $(id); if (el) el.oninput = recalc;
  });

  $('ee-meal-pick').addEventListener('click', (e) => {
    const b = e.target.closest('[data-meal-pick]');
    if (!b) return;
    selectedMeal = b.dataset.mealPick;
    $('ee-meal-pick').querySelectorAll('button').forEach(x => x.classList.toggle('sel', x.dataset.mealPick === selectedMeal));
  });

  $('ee-save').onclick = async () => {
    const g = num($('ee-grams').value, 0);
    if (g <= 0) { toast('Quantità non valida'); return; }
    const patch = {
      grams: g,
      kcal: num($('ee-kcal').value, entry.kcal),
      protein: num($('ee-p').value, entry.protein),
      carbs: num($('ee-c').value, entry.carbs),
      fat: num($('ee-fat').value, entry.fat),
      fiber: num($('ee-fib').value, entry.fiber),
      sugar: num($('ee-sug').value, entry.sugar),
      sodium: num($('ee-sod').value, entry.sodium),
    };
    if (selectedMeal !== meal) {
      await moveDiaryEntry(meal, entryId, selectedMeal);
      await updateDiaryEntry(selectedMeal, entryId, patch);
    } else {
      await updateDiaryEntry(meal, entryId, patch);
    }
    closeSheet();
    toast('Modifiche salvate');
    render();
  };
  $('ee-delete').onclick = async () => {
    if (!confirm('Rimuovere questa voce dal diario?')) return;
    await removeFromDiary(meal, entryId);
    closeSheet();
    toast('Rimosso');
    render();
  };
  $('ee-cancel').onclick = closeSheet;
}

/* ─── GOALS SHEET (con obiettivi per giorno settimana) ───── */
const _goalsEditor = {
  activeDay: 'default',      // 'default' | '0'..'6'  (0=Dom)
  workingSchema: null,       // clone modificabile dello schema
};

function openGoalsSheet() {
  _goalsEditor.activeDay = 'default';
  _goalsEditor.workingSchema = JSON.parse(JSON.stringify(state.goalsSchema || emptyGoalsSchema()));
  renderGoalsSheet();
}

function renderGoalsSheet() {
  const schema = _goalsEditor.workingSchema;
  const day = _goalsEditor.activeDay;
  const isDefault = day === 'default';
  const effective = isDefault
    ? schema.default
    : { ...schema.default, ...(schema.perWeekday[day] || {}) };
  const hasOverride = !isDefault && !!schema.perWeekday[day];

  const dayChips = [
    { k: 'default', label: 'Base' },
    { k: '1', label: 'Lun' },
    { k: '2', label: 'Mar' },
    { k: '3', label: 'Mer' },
    { k: '4', label: 'Gio' },
    { k: '5', label: 'Ven' },
    { k: '6', label: 'Sab' },
    { k: '0', label: 'Dom' },
  ];

  const subtext = isDefault
    ? 'Base: applicati a tutti i giorni, salvo override specifici.'
    : (hasOverride ? 'Override attivo per questo giorno.' : 'Questo giorno eredita dai valori Base. Modifica per creare un override.');

  const html = `
    <h2 class="sheet-title">Obiettivi giornalieri</h2>
    <p class="sheet-sub">${esc(subtext)}</p>

    <div class="day-chips">
      ${dayChips.map(c => {
        const override = c.k !== 'default' && !!schema.perWeekday[c.k];
        return `<button type="button" class="day-chip ${day === c.k ? 'sel' : ''} ${override ? 'has-override' : ''}" data-day-chip="${c.k}">${esc(c.label)}${override ? '<span class="override-dot"></span>' : ''}</button>`;
      }).join('')}
    </div>

    ${!isDefault && !hasOverride ? `
      <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;margin-bottom:14px;font-size:12px;color:var(--text-2);line-height:1.5">
        <span style="flex:1">Questo giorno eredita i valori Base. Modifica i campi per creare un override.</span>
      </div>
    ` : ''}

    <form id="goals-form">
      <div class="field">
        <label style="display:flex;align-items:center;justify-content:space-between">
          <span>Calorie (kcal)</span>
          <span style="font-size:10px;color:var(--text-3);font-weight:500;text-transform:uppercase;letter-spacing:0.06em">Auto · 4·4·9</span>
        </label>
        <input class="input" type="number" name="calories" min="0" max="9999" value="${effective.calories}" id="goals-calories" readonly style="opacity:0.85;cursor:not-allowed">
      </div>
      <div class="row-3">
        <div class="field"><label>Proteine (g)</label><input class="input" type="number" name="protein" min="0" max="500" value="${effective.protein}" data-auto-kcal required></div>
        <div class="field"><label>Carb (g)</label><input class="input" type="number" name="carbs" min="0" max="800" value="${effective.carbs}" data-auto-kcal required></div>
        <div class="field"><label>Grassi (g)</label><input class="input" type="number" name="fat" min="0" max="300" value="${effective.fat}" data-auto-kcal required></div>
      </div>
      <div class="row-3">
        <div class="field"><label>Fibre (g)</label><input class="input" type="number" name="fiber" min="0" max="200" value="${effective.fiber}" required></div>
        <div class="field"><label>Zucch (g)</label><input class="input" type="number" name="sugar" min="0" max="500" value="${effective.sugar}" required></div>
        <div class="field"><label>Saturi (g)</label><input class="input" type="number" name="sodium" min="0" max="10000" value="${effective.sodium}" required></div>
      </div>

      ${!isDefault && hasOverride ? `
        <button class="btn btn-danger" type="button" id="goals-reset-day" style="margin-bottom:8px">Rimuovi override per questo giorno</button>
      ` : ''}

      <button class="btn btn-primary" type="submit">${isDefault ? 'Salva Base' : (hasOverride ? 'Aggiorna override' : 'Crea override per ' + esc(dayChips.find(c => c.k === day).label))}</button>
    </form>
  `;

  openSheet(html);

  // Day chip switching: legge i valori correnti nel form, li salva temporaneamente e ridisegna
  document.querySelectorAll('[data-day-chip]').forEach(btn => {
    btn.onclick = () => {
      const form = document.getElementById('goals-form');
      const fd = new FormData(form);
      const values = {};
      for (const k of ['calories','protein','carbs','fat','fiber','sugar','sodium']) values[k] = num(fd.get(k));
      // Scrivi temporaneamente per non perdere le modifiche non salvate
      if (_goalsEditor.activeDay === 'default') {
        _goalsEditor.workingSchema.default = values;
      } else {
        // Confronta con default: se identico e non era già override, non creare
        const baseline = _goalsEditor.workingSchema.default;
        const diff = {};
        let differs = false;
        for (const k of ['calories','protein','carbs','fat','fiber','sugar','sodium']) {
          if (values[k] !== baseline[k]) { diff[k] = values[k]; differs = true; }
        }
        if (differs) _goalsEditor.workingSchema.perWeekday[_goalsEditor.activeDay] = values;
        // se non differs e non c'era un override, lascialo stare
      }
      _goalsEditor.activeDay = btn.dataset.dayChip;
      renderGoalsSheet();
    };
  });

  // Form reference (presets rimossi: solo personalizzazione manuale)
  const form = document.getElementById('goals-form');

  // Auto-calcolo calorie da macros (formula 4·4·9):
  // proteine × 4 + carbo × 4 + grassi × 9
  const kcalInput = document.getElementById('goals-calories');
  const recalcKcal = () => {
    const fd = new FormData(form);
    const p = num(fd.get('protein'));
    const c = num(fd.get('carbs'));
    const f = num(fd.get('fat'));
    const total = Math.round(p * 4 + c * 4 + f * 9);
    if (kcalInput) kcalInput.value = total;
  };
  form.querySelectorAll('[data-auto-kcal]').forEach(inp => {
    inp.addEventListener('input', recalcKcal);
  });

  // Reset override
  const resetBtn = document.getElementById('goals-reset-day');
  if (resetBtn) {
    resetBtn.onclick = () => {
      delete _goalsEditor.workingSchema.perWeekday[_goalsEditor.activeDay];
      renderGoalsSheet();
    };
  }

  // Submit
  form.onsubmit = async (e) => {
    e.preventDefault();
    // Forza ricalcolo prima del submit per essere sicuri
    recalcKcal();
    const fd = new FormData(form);
    const values = {};
    for (const k of ['calories','protein','carbs','fat','fiber','sugar','sodium']) values[k] = num(fd.get(k));
    if (_goalsEditor.activeDay === 'default') {
      _goalsEditor.workingSchema.default = values;
    } else {
      _goalsEditor.workingSchema.perWeekday[_goalsEditor.activeDay] = values;
    }
    await saveGoalsSchema(_goalsEditor.workingSchema);
    closeSheet();
    toast('Obiettivi salvati');
    render();
  };
}

/* ─── CUSTOM FOODS SHEET ───────────────────────────────── */
function openCustomFoodsSheet(filter = '') {
  const all = state.customFoods;
  const renderListHtml = (filterStr) => {
    const fLow = stripAccents((filterStr || '').trim().toLowerCase());
    const list = !fLow ? all : all.filter(f => {
      const hay = stripAccents(((f.name || '') + ' ' + (f.brand || '') + ' ' + (f.notes || '')).toLowerCase());
      return fLow.split(/\s+/).every(t => hay.includes(t));
    });
    return {
      sub: `${all.length} alimenti${fLow ? ` · ${list.length} risultati` : ' con i tuoi valori nutrizionali'}`,
      list,
      html: all.length === 0
        ? `<div class="subtle-list-empty">Nessun alimento salvato</div>`
        : list.length === 0
          ? `<div class="subtle-list-empty">Nessun risultato</div>`
          : list.slice(0, 100).map(f => {
            const kcalSuffix = f.unitName ? `kcal/${f.unitName}` : 'kcal/100g';
            return `
            <div style="display:flex;align-items:center;gap:12px;padding:12px 6px;border-bottom:1px solid var(--border)">
              <div style="flex:1;min-width:0">
                <div style="font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(f.name)}${f.notes ? ` <span style="color:var(--accent);font-size:11px" title="${esc(f.notes)}">●</span>` : ''}</div>
                <div style="font-size:12px;color:var(--text-2);margin-top:2px">${esc(f.brand || 'Senza marca')} · ${round(f.kcal)} ${kcalSuffix}</div>
                ${f.notes ? `<div style="font-size:11px;color:var(--text-3);margin-top:3px;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%">${esc(f.notes)}</div>` : ''}
              </div>
              <button class="icon-btn" data-edit-custom="${esc(f.id)}" aria-label="Modifica">${I.edit}</button>
              <button class="icon-btn" data-del-custom="${esc(f.id)}" aria-label="Elimina" style="color:var(--text-3)">${I.trash}</button>
            </div>
          `;
          }).join('') + (list.length > 100 ? `<div style="padding:14px;text-align:center;font-size:12px;color:var(--text-3)">${list.length - 100} altri risultati. Affina la ricerca.</div>` : ''),
    };
  };
  const initial = renderListHtml(filter);
  const html = `
    <h2 class="sheet-title">I miei alimenti</h2>
    <p class="sheet-sub" id="cf-sub">${initial.sub}</p>
    <button class="btn btn-primary" id="new-custom" style="margin-bottom:8px">${I.plus}<span>Nuovo alimento</span></button>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">
      <button class="btn btn-secondary" id="cf-export" style="padding:10px;font-size:13px">${I.copy}<span>Esporta CSV</span></button>
      <button class="btn btn-secondary" id="cf-import" style="padding:10px;font-size:13px">${I.box}<span>Importa CSV</span></button>
    </div>
    ${all.length > 0 ? `
    <div class="field" style="margin-bottom:10px">
      <input class="input" id="cf-search" placeholder="Cerca tra i tuoi alimenti..." value="${esc(filter)}" autocomplete="off" autocapitalize="off" autocorrect="off">
    </div>` : ''}
    <div id="custom-list" style="max-height:60vh;overflow-y:auto">${initial.html}</div>
  `;
  openSheet(html);
  // Bind delete/edit handlers (delegated, sopravvivono ai re-render della lista)
  const listEl = document.getElementById('custom-list');
  const bindRowActions = () => {
    listEl.querySelectorAll('[data-edit-custom]').forEach(b => {
      b.onclick = () => openCustomFoodEditor(state.customFoods.find(f => f.id === b.dataset.editCustom));
    });
    listEl.querySelectorAll('[data-del-custom]').forEach(b => {
      b.onclick = async () => {
        if (!confirm('Eliminare questo alimento?')) return;
        // Salva scroll position prima della modifica
        const scrollTop = listEl.scrollTop;
        await deleteCustomFood(b.dataset.delCustom);
        await loadCustomFoods();
        // Aggiorno SOLO la lista (preserva scroll e search input)
        const cur = document.getElementById('cf-search');
        const updated = renderListHtml(cur ? cur.value : '');
        const subEl = document.getElementById('cf-sub');
        if (subEl) subEl.textContent = updated.sub;
        // Aggiorna anche la lista dei dati interni perché è cambiata
        all.length = 0;
        Array.prototype.push.apply(all, state.customFoods);
        const newData = renderListHtml(cur ? cur.value : '');
        listEl.innerHTML = newData.html;
        if (subEl) subEl.textContent = newData.sub;
        listEl.scrollTop = scrollTop;
        bindRowActions();
      };
    });
  };
  bindRowActions();
  // Search input: aggiorna SOLO la lista, NON ricrea l'intero sheet (preserva focus)
  const searchInput = document.getElementById('cf-search');
  if (searchInput) {
    let t;
    searchInput.oninput = () => {
      clearTimeout(t);
      t = setTimeout(() => {
        const updated = renderListHtml(searchInput.value);
        const subEl = document.getElementById('cf-sub');
        if (subEl) subEl.textContent = updated.sub;
        listEl.innerHTML = updated.html;
        bindRowActions();
      }, 180);
    };
  }
  document.getElementById('new-custom').onclick = () => openCustomFoodEditor(null);
  document.getElementById('cf-export').onclick = () => openExportFoodsChoiceSheet();
  document.getElementById('cf-import').onclick = () => handleImportFoodsCSV();
}
/* ─── DATABASE ALIMENTI ───────────────────────────────────

   al DB CREA-INRAN. Le modifiche sono salvate come override
   in storage e propagate al cloud via auto-sync.

async function openDbFoodsSheet(filter = '', showHidden = false) {
  // Refresh cache per essere certi di avere lo stato più recente

  const totalMod = list.filter(f => f._modified).length;
  const totalAdd = list.filter(f => f._kind === 'added').length;

  const renderListData = (filterStr) => {
    const fLow = stripAccents((filterStr || '').trim().toLowerCase());
    const filtered = !fLow ? list : list.filter(f => {

      return fLow.split(/\s+/).every(t => hay.includes(t));
    });
    return {
      sub: `${list.length} alimenti${totalMod || totalAdd ? ` · ${totalMod} modificat${totalMod === 1 ? 'o' : 'i'}, ${totalAdd} aggiunt${totalAdd === 1 ? 'o' : 'i'}` : ' · valori CREA-INRAN ufficiali'}${hiddenCount && !showHidden ? ` · ${hiddenCount} rimoss${hiddenCount === 1 ? 'o' : 'i'}` : ''}${fLow ? ` · ${filtered.length} risultati` : ''}`,

            return `

              </div>
              ${f._hidden
                ? `<button class="icon-btn" data-restore-db="${idAttr}" aria-label="Ripristina" style="color:var(--accent)">${I.refresh}</button>`
                : `<button class="icon-btn" data-edit-db="${idAttr}" aria-label="Modifica">${I.edit}</button>`
              }
            </div>`;
          }).join('') + (filtered.length > 100 ? `<div style="padding:14px;text-align:center;font-size:12px;color:var(--text-3)">${filtered.length - 100} altri risultati. Affina la ricerca.</div>` : ''),
    };
  };
  const initial = renderListData(filter);
  const html = `
    <h2 class="sheet-title">Database alimenti${showHidden ? ' (con rimossi)' : ''}</h2>
    <p class="sheet-sub" id="db-sub">${initial.sub}</p>

    <button class="btn btn-primary" id="db-new" style="margin-bottom:10px">${I.plus}<span>Nuovo alimento</span></button>

    <div class="field" style="margin-bottom:10px">
      <input class="input" id="db-search" placeholder="Cerca nel database..." value="${esc(filter)}" autocomplete="off" autocapitalize="off" autocorrect="off">
    </div>

    <div id="db-list" style="max-height:60vh;overflow-y:auto">${initial.html}</div>

    ${hiddenCount > 0 ? `
      <button class="btn btn-ghost" id="db-toggle-hidden" style="margin-top:14px;font-size:13px">
        ${showHidden ? 'Nascondi alimenti rimossi' : `Mostra ${hiddenCount} alimenti rimossi`}
      </button>
    ` : ''}
  `;
  openSheet(html);
  const listEl = document.getElementById('db-list');
  const bindRowActions = () => {
    listEl.querySelectorAll('[data-edit-db]').forEach(b => {
      b.onclick = () => {
        const ref = b.dataset.editDb;
        if (ref.startsWith('add-')) {
          const addId = ref.slice(4);
          const food = list.find(f => f._kind === 'added' && f._addId === addId);
          if (food) openDbFoodEditor(food);
        } else if (ref.startsWith('idx-')) {
          const idx = parseInt(ref.slice(4), 10);
          const food = list.find(f => f._kind === 'builtin' && f._index === idx);
          if (food) openDbFoodEditor(food);
        }
      };
    });
    listEl.querySelectorAll('[data-restore-db]').forEach(b => {
      b.onclick = async () => {
        const ref = b.dataset.restoreDb;
        if (!ref.startsWith('idx-')) return;
        const idx = parseInt(ref.slice(4), 10);
        const scrollTop = listEl.scrollTop;
        await sd(`dbHidden:${state.user.userId}:${idx}`);
        await refreshDbFoodsCache();
        scheduleCloudAutoSync();
        toast('Ripristinato');
        const cur = document.getElementById('db-search');
        await openDbFoodsSheet(cur ? cur.value : '', showHidden);
        // Ripristina scroll
        const newList = document.getElementById('db-list');
        if (newList) newList.scrollTop = scrollTop;
      };
    });
  };
  bindRowActions();
  const searchInput = document.getElementById('db-search');
  if (searchInput) {
    let t;
    searchInput.oninput = () => {
      clearTimeout(t);
      t = setTimeout(() => {
        const updated = renderListData(searchInput.value);
        const subEl = document.getElementById('db-sub');
        if (subEl) subEl.textContent = updated.sub;
        listEl.innerHTML = updated.html;
        bindRowActions();
      }, 180);
    };
  }
  document.getElementById('db-new').onclick = () => openDbFoodEditor(null);
  const toggleBtn = document.getElementById('db-toggle-hidden');
  if (toggleBtn) toggleBtn.onclick = () => {
    const cur = document.getElementById('db-search');
    openDbFoodsSheet(cur ? cur.value : '', !showHidden);
  };
}

    const fd = new FormData(cfForm);
    const p = num(fd.get('protein'));
    const c = num(fd.get('carbs'));
    const ft = num(fd.get('fat'));

  };
